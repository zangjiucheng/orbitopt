<title>Solar System Explorer</title>
<style>
  :root {
    color-scheme: dark;
    --bg-void:      #06050c;
    --bg-glow:      #0d0b1c;
    --surface:      #12101f;
    --surface-2:    #1a1730;
    --ink-primary:  #f4f2ea;
    --ink-secondary:#a9a6bb;
    --ink-muted:    #6f6c85;
    --hairline:     rgba(244,242,234,0.10);
    --accent:       #f4c05a;
    --sun-core:     #fff4d6;
    --sun-glow:     #ffcf5c;

    --c-mercury:    #c4785a;
    --c-venus:      #ae8819;
    --c-earth:      #4c8eff;
    --c-mars:       #e14b3d;
    --c-jupiter:    #d9722e;
    --c-saturn:     #2fa97a;
    --c-uranus:     #2fa69e;
    --c-neptune:    #8c7fe0;
    --c-pluto:      #8c8496;

    --font-display: -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    --font-mono:    ui-monospace, "SF Mono", "Cascadia Code", "Consolas", monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: var(--bg-void);
    font-family: var(--font-display);
    -webkit-tap-highlight-color: transparent;
  }

  #stage {
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 120% 90% at 50% 45%, var(--bg-glow) 0%, var(--bg-void) 60%);
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: grab;
    touch-action: none;
  }
  canvas.dragging { cursor: grabbing; }

  .hud {
    position: fixed;
    pointer-events: none;
    color: var(--ink-primary);
  }

  .hud > * { pointer-events: auto; }

  #title-block {
    top: 20px;
    left: 20px;
    max-width: 360px;
  }

  #title-block h1 {
    margin: 0 0 4px;
    font-size: 17px;
    font-weight: 650;
    letter-spacing: 0.01em;
    text-wrap: balance;
  }

  #title-block .epoch {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 12px;
    color: var(--ink-secondary);
    letter-spacing: 0.02em;
  }

  #title-block .hint {
    margin-top: 10px;
    font-size: 11.5px;
    color: var(--ink-muted);
    line-height: 1.5;
    max-width: 300px;
  }

  #controls {
    top: 20px;
    right: 20px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    align-items: flex-end;
  }

  .preset-btn {
    font-family: var(--font-display);
    font-size: 11.5px;
    font-weight: 600;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--ink-secondary);
    background: rgba(18,16,31,0.72);
    border: 1px solid var(--hairline);
    border-radius: 7px;
    padding: 7px 12px;
    backdrop-filter: blur(6px);
    cursor: pointer;
    transition: color 120ms ease, border-color 120ms ease, background 120ms ease;
    min-width: 128px;
    text-align: right;
  }
  .preset-btn:hover {
    color: var(--ink-primary);
    border-color: rgba(244,192,90,0.4);
    background: rgba(26,23,48,0.85);
  }
  .preset-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }
  .preset-btn.active {
    color: var(--accent);
    border-color: rgba(244,192,90,0.55);
  }

  #legend {
    left: 20px;
    bottom: 20px;
    background: rgba(18,16,31,0.72);
    border: 1px solid var(--hairline);
    border-radius: 10px;
    padding: 12px 14px;
    backdrop-filter: blur(6px);
    display: grid;
    grid-template-columns: repeat(3, auto);
    gap: 6px 18px;
    max-width: 340px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 11.5px;
    color: var(--ink-secondary);
    cursor: pointer;
    user-select: none;
  }
  .legend-item:hover { color: var(--ink-primary); }
  .legend-item .swatch {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    flex: none;
    box-shadow: 0 0 6px 0 currentColor;
  }
  .legend-note {
    grid-column: 1 / -1;
    font-size: 10px;
    color: var(--ink-muted);
    margin-top: 2px;
    border-top: 1px solid var(--hairline);
    padding-top: 6px;
    line-height: 1.5;
  }

  #scalebar {
    right: 20px;
    bottom: 20px;
    display: flex;
    flex-direction: column;
    align-items: flex-end;
    gap: 4px;
  }
  #scalebar .bar {
    height: 3px;
    background: var(--ink-secondary);
    border-radius: 2px;
    position: relative;
  }
  #scalebar .bar::before, #scalebar .bar::after {
    content: "";
    position: absolute;
    top: -3px;
    width: 1px;
    height: 9px;
    background: var(--ink-secondary);
  }
  #scalebar .bar::before { left: 0; }
  #scalebar .bar::after { right: 0; }
  #scalebar .label {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    font-size: 11px;
    color: var(--ink-secondary);
  }

  #tooltip {
    position: fixed;
    pointer-events: none;
    background: rgba(18,16,31,0.94);
    border: 1px solid var(--hairline);
    border-radius: 9px;
    padding: 10px 13px;
    min-width: 168px;
    box-shadow: 0 8px 28px rgba(0,0,0,0.45);
    opacity: 0;
    transform: translateY(3px);
    transition: opacity 110ms ease, transform 110ms ease;
    z-index: 20;
  }
  #tooltip.visible { opacity: 1; transform: translateY(0); }
  #tooltip .name {
    font-size: 13.5px;
    font-weight: 650;
    margin-bottom: 6px;
    letter-spacing: 0.01em;
  }
  #tooltip .row {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    font-size: 11px;
    color: var(--ink-secondary);
    padding: 1.5px 0;
  }
  #tooltip .row .v {
    font-family: var(--font-mono);
    font-variant-numeric: tabular-nums;
    color: var(--ink-primary);
  }

  #a11y-note {
    position: fixed;
    top: -999px;
  }

  @media (max-width: 640px) {
    #legend { grid-template-columns: repeat(2, auto); max-width: 260px; font-size: 10.5px; }
    #title-block { max-width: 220px; }
    #title-block .hint { display: none; }
    .preset-btn { min-width: 96px; padding: 6px 10px; }
  }
</style>

<div id="stage">
  <canvas id="cv"></canvas>
</div>

<div class="hud" id="title-block">
  <h1>Solar System Explorer</h1>
  <div class="epoch" id="epoch-label"></div>
  <div class="hint">Scroll or pinch to zoom &middot; drag to pan &middot; hover a body for details. Orbits are true to scale; planet markers are enlarged for visibility.</div>
</div>

<div class="hud" id="controls">
  <button class="preset-btn" data-view="whole">Whole System</button>
  <button class="preset-btn" data-view="inner">Inner Planets</button>
  <button class="preset-btn" data-view="outer">Outer Planets</button>
</div>

<div class="hud" id="legend"></div>

<div class="hud" id="scalebar">
  <div class="bar" id="scale-bar" style="width:100px;"></div>
  <div class="label" id="scale-label">1 AU</div>
</div>

<div id="tooltip"></div>

function formatEpoch(mjd) {
  const d = new Date(Date.UTC(2000, 0, 1, 0, 0, 0) + mjd * 86400000);
  return d.toLocaleDateString("en-US", { year: "numeric", month: "long", day: "numeric", timeZone: "UTC" });
}

const canvas = document.getElementById("cv");
const ctx = canvas.getContext("2d");
const tooltip = document.getElementById("tooltip");
const epochLabel = document.getElementById("epoch-label");
const scaleBar = document.getElementById("scale-bar");
const scaleLabel = document.getElementById("scale-label");

epochLabel.textContent = formatEpoch(DATA.epoch_mjd2000) + " — heliocentric, ecliptic plane";

let dpr = Math.min(window.devicePixelRatio || 1, 2.5);
let cw = 0, ch = 0;

const view = { scale: 10, panX: 0, panY: 0 };
let animTarget = null, animStart = null, animT0 = 0;

const STAR_COUNT = 260;
const stars = Array.from({ length: STAR_COUNT }, () => ({
  x: Math.random(), y: Math.random(),
  r: Math.random() * 1.1 + 0.25,
  a: Math.random() * 0.55 + 0.15,
  tw: Math.random() * Math.PI * 2
}));

function resize() {
  const rect = canvas.getBoundingClientRect();
  cw = rect.width; ch = rect.height;
  canvas.width = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  draw();
}

function worldToScreen(x, y) {
  return {
    x: cw / 2 + view.panX + x * view.scale,
    y: ch / 2 + view.panY - y * view.scale
  };
}
function screenToWorld(sx, sy) {
  return {
    x: (sx - cw / 2 - view.panX) / view.scale,
    y: -(sy - ch / 2 - view.panY) / view.scale
  };
}

function scaleForRadiusAU(radiusAU, marginFrac) {
  const dim = Math.min(cw, ch) * (1 - marginFrac);
  return dim / 2 / radiusAU;
}

const VIEWS = {
  whole: () => ({ scale: scaleForRadiusAU(46, 0.14), panX: 0, panY: 0 }),
  inner: () => ({ scale: scaleForRadiusAU(1.75, 0.22), panX: 0, panY: 0 }),
  outer: () => ({ scale: scaleForRadiusAU(31, 0.16), panX: 0, panY: 0 })
};

function clampScale(s) {
  const minS = scaleForRadiusAU(46, 0.05);
  const maxS = scaleForRadiusAU(0.05, 0.4);
  return Math.max(minS, Math.min(maxS, s));
}

function animateTo(target, presetName) {
  animStart = { scale: view.scale, panX: view.panX, panY: view.panY };
  animTarget = target;
  animT0 = performance.now();
  document.querySelectorAll(".preset-btn").forEach(b => b.classList.toggle("active", b.dataset.view === presetName));
  requestAnimationFrame(stepAnim);
}
function easeInOutCubic(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
function stepAnim(now) {
  const dur = 620;
  let t = Math.min(1, (now - animT0) / dur);
  const e = easeInOutCubic(t);
  view.scale = animStart.scale + (animTarget.scale - animStart.scale) * e;
  view.panX = animStart.panX + (animTarget.panX - animStart.panX) * e;
  view.panY = animStart.panY + (animTarget.panY - animStart.panY) * e;
  draw();
  if (t < 1) requestAnimationFrame(stepAnim);
  else animTarget = null;
}

function niceScaleValue(targetPx) {
  const auPerPx = 1 / view.scale;
  const rawAU = targetPx * auPerPx;
  const mag = Math.pow(10, Math.floor(Math.log10(rawAU)));
  const candidates = [1, 2, 5, 10].map(m => m * mag);
  let best = candidates[0], bestDiff = Infinity;
  for (const c of candidates) {
    const px = c * view.scale;
    const diff = Math.abs(px - targetPx);
    if (diff < bestDiff) { bestDiff = diff; best = c; }
  }
  return best;
}
function updateScaleBar() {
  const au = niceScaleValue(110);
  const px = au * view.scale;
  scaleBar.style.width = Math.max(24, px) + "px";
  scaleLabel.textContent = (au >= 1 ? au : au.toFixed(2)) + " AU";
}

function drawStars() {
  ctx.save();
  for (const s of stars) {
    const tw = 0.75 + 0.25 * Math.sin(s.tw);
    ctx.globalAlpha = s.a * tw;
    ctx.fillStyle = "#f4f2ea";
    ctx.beginPath();
    ctx.arc(s.x * cw, s.y * ch, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(p.x, p.y, glowR, 0, Math.PI * 2);
  ctx.fill();

  const coreR = Math.max(5, Math.min(11, glowR * 0.16));
  ctx.fillStyle = "#fff4d6";
  ctx.beginPath();
  ctx.arc(p.x, p.y, coreR, 0, Math.PI * 2);
  ctx.fill();
}

const fontFamily = getComputedStyle(document.documentElement).getPropertyValue("--font-display").trim();

function orbitPath(body) {
  const pts = DATA.bodies[body].orbit_au;
  ctx.beginPath();
  for (let i = 0; i < pts.length; i++) {
    const s = worldToScreen(pts[i][0], pts[i][1]);
    if (i === 0) ctx.moveTo(s.x, s.y); else ctx.lineTo(s.x, s.y);
  }
  ctx.closePath();
}

function markerRadius(name) {
  const base = { mercury: 3.2, venus: 4.4, earth: 4.6, mars: 3.6, jupiter: 7.4, saturn: 6.8, uranus: 5.4, neptune: 5.3, pluto: 2.6 };
  return base[name] || 4;
}

let screenPositions = {};

function draw() {
  ctx.clearRect(0, 0, cw, ch);
  drawStars();

  for (const name of ORDER) {
    ctx.strokeStyle = COLOR[name];
    ctx.globalAlpha = 0.5;
    ctx.lineWidth = 1.1;
    orbitPath(name);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  ctx.save();
  ctx.strokeStyle = COLOR.pluto;
  ctx.globalAlpha = 0.45;
  ctx.lineWidth = 1;
  ctx.setLineDash([4, 5]);
  orbitPath("pluto");
  ctx.stroke();
  ctx.restore();

  drawSun();

  screenPositions = {};
  const allNames = ORDER.concat(["pluto"]);
  for (const name of allNames) {
    const b = DATA.bodies[name];
    const p = worldToScreen(b.position_au[0], b.position_au[1]);
    screenPositions[name] = p;
    if (p.x < -60 || p.x > cw + 60 || p.y < -60 || p.y > ch + 60) continue;

    const r = markerRadius(name);
    const isHover = hovered === name;

    if (isHover) {
      ctx.save();
      ctx.shadowColor = COLOR[name];
      ctx.shadowBlur = 16;
      ctx.beginPath();
      ctx.arc(p.x, p.y, r + 3, 0, Math.PI * 2);
      ctx.strokeStyle = COLOR[name];
      ctx.globalAlpha = 0.8;
      ctx.lineWidth = 1.4;
      ctx.stroke();
      ctx.restore();
    }

    ctx.beginPath();
    ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    ctx.fillStyle = COLOR[name];
    ctx.fill();

    const showLabel = view.scale > 3.2 || isHover;
    if (showLabel) {
      ctx.font = (isHover ? "650 " : "500 ") + "11.5px " + fontFamily;
      ctx.fillStyle = isHover ? "#f4f2ea" : "rgba(244,242,234,0.72)";
      ctx.textBaseline = "middle";
      ctx.fillText(LABEL[name], p.x + r + 6, p.y);
    }
  }

  updateScaleBar();
}

let hovered = null;
function pickBody(mx, my) {
  let best = null, bestD = Infinity;
  for (const name in screenPositions) {
    const p = screenPositions[name];
    const d = Math.hypot(p.x - mx, p.y - my);
    const hitRadius = markerRadius(name) + 7;
    if (d < hitRadius && d < bestD) { best = name; bestD = d; }
  }
  return best;
}

function showTooltip(name, mx, my) {
  const b = DATA.bodies[name];
  tooltip.innerHTML =
    '<div class="name" style="color:' + COLOR[name] + '">' + LABEL[name] + (name === "pluto" ? " <span style=\"color:var(--ink-muted);font-weight:500;font-size:11px\">(dwarf planet)</span>" : "") + '</div>' +
    '<div class="row"><span>Distance from Sun</span><span class="v">' + b.distance_au.toFixed(3) + ' AU</span></div>' +
    '<div class="row"><span>Orbital period</span><span class="v">' + formatPeriod(b.period_days) + '</span></div>' +
    '<div class="row"><span>Heliocentric speed</span><span class="v">' + b.speed_km_s.toFixed(2) + ' km/s</span></div>' +
    '<div class="row"><span>Eccentricity</span><span class="v">' + b.eccentricity.toFixed(3) + '</span></div>' +
    '<div class="row"><span>Inclination</span><span class="v">' + b.inclination_deg.toFixed(2) + '°</span></div>';
  tooltip.classList.add("visible");
  positionTooltip(mx, my);
}
function positionTooltip(mx, my) {
  const pad = 16;
  let left = mx + pad, top = my + pad;
  const tw = tooltip.offsetWidth || 190, th = tooltip.offsetHeight || 120;
  if (left + tw > window.innerWidth - 8) left = mx - tw - pad;
  if (top + th > window.innerHeight - 8) top = my - th - pad;
  tooltip.style.left = left + "px";
  tooltip.style.top = top + "px";
}
function hideTooltip() {
  tooltip.classList.remove("visible");
}
function formatPeriod(days) {
  if (days < 500) return days.toFixed(1) + " days";
  return (days / 365.25).toFixed(2) + " years";
}

let dragging = false, lastX = 0, lastY = 0, moved = false;

canvas.addEventListener("mousedown", e => {
  dragging = true; moved = false;
  lastX = e.clientX; lastY = e.clientY;
  canvas.classList.add("dragging");
});
window.addEventListener("mouseup", () => { dragging = false; canvas.classList.remove("dragging"); });
window.addEventListener("mousemove", e => {
  if (dragging) {
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    if (Math.abs(dx) + Math.abs(dy) > 2) moved = true;
    view.panX += dx; view.panY += dy;
    lastX = e.clientX; lastY = e.clientY;
    hideTooltip();
    draw();
    return;
  }
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const h = pickBody(mx, my);
  if (h !== hovered) {
    hovered = h;
    draw();
  }
  if (hovered) { showTooltip(hovered, e.clientX, e.clientY); canvas.style.cursor = "pointer"; }
  else { hideTooltip(); canvas.style.cursor = "grab"; }
});
canvas.addEventListener("mouseleave", () => { hovered = null; hideTooltip(); draw(); });

canvas.addEventListener("wheel", e => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left, my = e.clientY - rect.top;
  const before = screenToWorld(mx, my);
  const factor = Math.exp(-e.deltaY * 0.0016);
  view.scale = clampScale(view.scale * factor);
  view.panX = mx - cw / 2 - before.x * view.scale;
  view.panY = my - ch / 2 + before.y * view.scale;
  document.querySelectorAll(".preset-btn").forEach(b => b.classList.remove("active"));
  draw();
}, { passive: false });

let touchMode = null, touchStart = null, pinchStartDist = 0, pinchStartScale = 1;
canvas.addEventListener("touchstart", e => {
  if (e.touches.length === 1) {
    touchMode = "pan";
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  } else if (e.touches.length === 2) {
    touchMode = "pinch";
    pinchStartDist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    pinchStartScale = view.scale;
  }
}, { passive: true });
canvas.addEventListener("touchmove", e => {
  e.preventDefault();
  if (touchMode === "pan" && e.touches.length === 1) {
    const dx = e.touches[0].clientX - touchStart.x;
    const dy = e.touches[0].clientY - touchStart.y;
    view.panX += dx; view.panY += dy;
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
    draw();
  } else if (touchMode === "pinch" && e.touches.length === 2) {
    const dist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    view.scale = clampScale(pinchStartScale * (dist / pinchStartDist));
    draw();
  }
}, { passive: false });
canvas.addEventListener("touchend", e => {
  if (e.touches.length === 0 && touchMode === "pan") {
    const rect = canvas.getBoundingClientRect();
  }
  touchMode = null;
}, { passive: true });

document.querySelectorAll(".preset-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    animateTo(VIEWS[btn.dataset.view](), btn.dataset.view);
  });
});

function buildLegend() {
  const el = document.getElementById("legend");
  const names = ORDER.concat(["pluto"]);
  el.innerHTML = names.map(n =>
    '<div class="legend-item" data-target="' + n + '" style="color:' + (n === "pluto" ? "var(--ink-secondary)" : "var(--ink-secondary)") + '">' +
      '<span class="swatch" style="background:' + COLOR[n] + ';color:' + COLOR[n] + '"></span>' + LABEL[n] +
    '</div>'
  ).join("") + '<div class="legend-note">Orbits drawn true to scale in the ecliptic plane. Planet markers are sized for visibility, not to scale. Positions shown for ' + formatEpoch(DATA.epoch_mjd2000) + '.</div>';

  el.querySelectorAll(".legend-item").forEach(item => {
    item.addEventListener("click", () => {
      const name = item.dataset.target;
      const b = DATA.bodies[name];
      const r = Math.max(b.distance_au * 1.35, 0.08);
      animateTo({ scale: scaleForRadiusAU(r, 0.3), panX: 0, panY: 0 }, null);
      hovered = name;
      draw();
    });
  });
}

window.addEventListener("resize", () => {
  dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  resize();
});

buildLegend();
resize();
const initial = VIEWS.whole();
view.scale = initial.scale; view.panX = initial.panX; view.panY = initial.panY;
document.querySelector('.preset-btn[data-view="whole"]').classList.add("active");
draw();

const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
if (!reducedMotion) {
  (function twinkle() {
    for (const s of stars) s.tw += 0.006 + Math.random() * 0.004;
    draw();
    requestAnimationFrame(twinkle);
  })();
}
</script>
