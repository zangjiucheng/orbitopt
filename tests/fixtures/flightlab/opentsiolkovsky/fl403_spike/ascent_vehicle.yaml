# Flight Lab E4 FL-403 (#208): flightlab vehicle file for the FL-403 3-DOF
# reference -- the JSBSim spike stage (FL-401, #206) mirrored for
# OpenTsiolkovsky: 10 t dry + 60 t propellant, 1.882877 MN vacuum thrust
# (Isp 320 s, 600 kg/s, MR 2.5), 100 s burn, token nozzle exit area
# (0.001 ft2 -> ~9 Pa*m2 ambient debit, matching the spike nozzle), zero
# aerodynamics (the JSBSim model has none). The attitude program flies
# stage-1 ascent to ~80 km at MECO (grazing pitch-over from vertical after
# an 8 s vertical hold; azimuth 90 deg due east from the equator).
name: fl403-spike-stage
provenance: illustrative
assumptions:
  - Illustrative single stage mirroring orbitopt/data/flightlab/jsbsim (FL-401); no real vehicle.
  - Zero aero (ca = 0, no CN-alpha): the 6-DOF spike model has zero aerodynamics, so the comparison is thrust+gravity only.
simulation:
  end_time_s: 105
  output_step_s: 1
  integrator:
    method: rk45
attitude_program:
- t_s: 0
  azimuth_deg: 90.0
  elevation_deg: 90.0
- t_s: 8
  azimuth_deg: 90.0
  elevation_deg: 90.0
- t_s: 50
  azimuth_deg: 90.0
  elevation_deg: 18.0
- t_s: 105
  azimuth_deg: 90.0
  elevation_deg: 18.0
stages:
- mass_initial_kg: 70000
  mass_dry_kg: 10000
  engine:
    thrust_vac_n: 1882876.8
    isp_vac_s: 320.0
    burn_start_s: 0
    burn_end_s: 100
    nozzle_exit_area_m2: 0.000092903
  free_flight: attitude_program
  aero:
    diameter_m: 3.7
    ca:
    - - 0
      - 0.0
    - - 40
      - 0.0
