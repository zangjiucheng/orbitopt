[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orbitopt"
version = "0.1.0"
description = "Scene-format read/write/validate and a PyVista/PySide6 3D viewer for orbital trajectory data; the full research framework additionally layers in pykep + tudatpy and CUDA-accelerated (CuPy) candidate evaluation via a conda environment."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]
# jsonschema + pyyaml are the only base dependencies: they're what
# orbitopt.scene_format (the scene file format's read/write/validate surface)
# and orbitopt.mission_config (the YAML mission-config read/validate surface)
# need, and nothing else in the base package requires numpy/pyvista/pykep/etc.
# -- see the [project.optional-dependencies] note below for why the compute
# stack (pykep/pygmo/tudatpy) is deliberately absent from this file entirely.
# `orbitopt run` still needs that compute stack (it actually optimizes/
# propagates), same as the "goes"/"artemis2" built-in missions already do --
# `orbitopt validate` alone works with just these two.
dependencies = [
    "jsonschema>=4.26",
    "pyyaml>=6.0",
]

[project.urls]
Repository = "https://github.com/zangjiucheng/orbitopt"

[project.optional-dependencies]
# The pip-installable subset: read/validate/view any SceneData scene file
# (orbitopt.scene_format, orbitopt.viz.pv_viewer, Mission Control) -- no conda
# needed. `pip install orbitopt[viewer]` gets exactly this.
viewer = [
    "numpy>=1.26",
    "pyvista>=0.48",
    "pyside6>=6.11",
    "pyvistaqt>=0.12",
]
# Deliberately no "compute" extras group here: pykep, pygmo, and tudatpy
# (needed by orbitopt.problems / orbitopt.verify / the mission-*computing*
# viz exporters) ship only on conda-forge/tudat-team and do not exist on
# PyPI at all -- listing them in optional-dependencies would make
# `pip install orbitopt[compute]` fail outright, not degrade gracefully.
# Building the compute stack means a conda environment; see environment.yml
# and this README's Setup section.

[project.scripts]
orbitopt = "orbitopt.cli:main"
orbitopt-app = "orbitopt.viz.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# The scene-format JSON Schema(s) and the planet/moon/sun texture images
# must ship inside the wheel/sdist -- by default setuptools only includes
# .py files, and both orbitopt.scene_format and orbitopt.viz.scene_renderer
# load these at runtime via importlib.resources.
orbitopt = ["schemas/*.json", "viz/assets/textures/*.jpg", "viz/assets/textures/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: multi-second tests that run a real tudatpy propagation or optimization loop"]
