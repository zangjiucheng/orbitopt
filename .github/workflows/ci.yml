name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}

    steps:
      - uses: actions/checkout@v4

      # Qt/VTK need a real (if virtual) X server plus the GL/xcb runtime libs
      # PySide6's xcb platform plugin loads -- confirmed empirically (see
      # tests/test_app.py) that VTK's *offscreen* rendering path doesn't work
      # reliably for a live Qt window, but a real X display via xvfb does.
      - name: Install headless Qt/VTK runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libgl1 \
            libegl1 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0

      # tudatpy is conda-forge/tudat-team only (no PyPI wheels) and pins
      # python=3.10 -- see environment.yml / README.md "Setup".
      - name: Set up Miniforge + orbitopt conda env
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: orbitopt
          use-mamba: true

      - name: Install orbitopt (editable, no-deps -- deps come from environment.yml)
        run: python -m pip install -e . --no-deps

      - name: Run test suite
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" pytest tests/ -v
