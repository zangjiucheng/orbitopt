name: CI

on:
  push:
    branches: [main]
    # Prose/site/translation changes do not need the scientific test stack.
    # These benchmark JSON files are also regression inputs, so keep testing them.
    paths:
      - '**'
      - '!docs/**'
      - '!translations/**'
      - '!**/*.md'
      - 'docs/benchmarks/**/*.json'
  pull_request:
    branches: [main]
    # Prose/site/translation changes do not need the scientific test stack.
    # These benchmark JSON files are also regression inputs, so keep testing them.
    paths:
      - '**'
      - '!docs/**'
      - '!translations/**'
      - '!**/*.md'
      - 'docs/benchmarks/**/*.json'
  workflow_dispatch:

jobs:
  test:
    name: test (CPU, linux-64, locked env)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}

    steps:
      - uses: actions/checkout@v4

      # Qt/VTK need a real (if virtual) X server plus the GL/xcb runtime libs
      # PySide6's xcb platform plugin loads -- confirmed empirically (see
      # tests/test_app.py) that VTK's *offscreen* rendering path doesn't work
      # reliably for a live Qt window, but a real X display via xvfb does.
      - name: Install headless Qt/VTK runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libgl1 \
            libegl1 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0

      # Installs the exact package set pinned in the CPU conda-lock file
      # (no solve at CI time). tudatpy is conda-forge/tudat-team only (no
      # PyPI wheels) and pins python=3.10 -- see envs/README.md.
      - name: Create locked CPU env
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: envs/cpu.conda-lock.yml
          environment-name: orbitopt
          # Cache package downloads, not the built env: the env cache is saved
          # after the test run, and a restored copy aborted on importing
          # tudatpy's extension modules (same lockfile, same package versions;
          # a fresh install of that lockfile ran fine).
          cache-downloads: true

      - name: Install orbitopt (editable, no-deps -- deps come from the lockfile)
        run: python -m pip install -e . --no-deps

      # FL-601: the Flight Lab suite must pass on the recorded fixtures
      # alone -- no OpenTsiolkovsky binary on this job (the adapter tests
      # use the recorded-output stub), and the committed Gate B reference
      # is checked for tampering here. The real-binary regression is the
      # separate flightlab-gateb job below.
      - name: Flight Lab unit tests on fixtures (no OT binary needed)
        run: >
          xvfb-run -a --server-args="-screen 0 1280x1024x24" pytest
          tests/test_flightlab_contract.py
          tests/test_flightlab_opentsiolkovsky.py
          tests/test_flightlab_simulate.py
          tests/test_flightlab_reference.py -v

      - name: Run test suite (gpu-marked tests skip here; see gpu.yml)
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" pytest tests/ -v

  flightlab-landing:
    # FL-303 landing-burn tests with the REAL pinned G-FOLD solver. gfold
    # 0.3.2 ships wheels for Python >= 3.11 only, and the locked conda envs
    # are Python 3.10, so in the `test` job every gfold test skips. This job
    # builds a Python 3.12 pip env from envs/flightlab-landing-ci.txt (same
    # numpy/scipy/astropy constraints as envs/cpu.yml, plus the exact gfold
    # pin) and runs the recovery suite there, slow tests included (~1 min).
    name: flightlab landing (gfold 0.3.2, Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the E2-04 tag-check diffs the push/PR range: in a
                           # depth-1 clone the PR merge-base fails the step and
                           # the push base is "not present", silently skipping it

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            envs/flightlab-landing-ci.txt
            envs/flightlab-landing.txt

      - name: Install the landing layer and orbitopt
        run: |
          python -m pip install -r envs/flightlab-landing-ci.txt
          python -m pip install -e . --no-deps

      - name: The pinned solver is importable (a missing gfold must fail here, not skip)
        run: python -c "import gfold, cvxpy; from importlib.metadata import version; assert version('gfold') == '0.3.2', version('gfold'); print('gfold', version('gfold'))"

      # E2-04 (task #257): the frozen dual-branch reference mission. The
      # provenance + input-pin guards are fast tests that also run in every
      # other job (without gfold the numerical rerun skips); the G5 guards
      # below mirror the FL-601 pair in the flightlab-gateb job. The real
      # regression -- re-fly the dual-branch mission and compare within the
      # declared tolerances -- is the slow test in tests/test_e204_reference.py,
      # collected here (this job has no "not slow" filter).
      - name: E2-04 frozen reference matches its provenance (G5 tamper check)
        run: python scripts/e204_reference.py verify

      - name: E2-04 reference changes require an explicit tagged update (G5)
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            BASE=$(git merge-base "origin/${GITHUB_BASE_REF}" HEAD)
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            BASE="${{ github.event.before }}"
          else
            BASE=""
          fi
          python scripts/e204_reference.py tag-check --base "$BASE"

      # E5-05 (task #272): the reproducible full-physical reference mission
      # (computed ascent -> parking + RTLS, coupled branches). Same G5 pair
      # as E2-04; the numerical regression -- replay the recorded ascent,
      # re-fly the recovery from the canonical separation handoff, compare
      # within the declared tolerances -- is the slow test in
      # tests/test_e505_reference.py, collected here.
      - name: E5-05 reference mission matches its provenance (G5 tamper check)
        run: python scripts/e505_reference.py verify

      - name: E5-05 reference changes require an explicit tagged update (G5)
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            BASE=$(git merge-base "origin/${GITHUB_BASE_REF}" HEAD)
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            BASE="${{ github.event.before }}"
          else
            BASE=""
          fi
          python scripts/e505_reference.py tag-check --base "$BASE"

      - name: Recovery and landing tests with the real solver
        run: >
          pytest -m "not gpu" -rs
          tests/test_flightlab_recovery_landing.py
          tests/test_flightlab_recovery_terminal_guidance.py
          tests/test_flightlab_recovery_model_mismatch.py
          tests/test_flightlab_recovery_handoff_check.py
          tests/test_flightlab_simulate_recovery.py
          tests/test_flightlab_recovery_envelope.py
          tests/test_e204_reference.py
          tests/test_e505_reference.py

  # E5-03 (task #270): cross-environment end to end. tudatpy lives only in
  # the conda-locked Python 3.10 env; gfold 0.3.2 only has >=3.11 wheels --
  # this job is exactly that split: the ascent leg runs in the locked conda
  # env, the recovery leg in a Python 3.12 venv, and the mission crosses
  # between them solely over the versioned, digest-sealed exchange envelopes
  # (orbitopt/schemas/crossenv-exchange-1.0.json). One `orbitopt crossenv
  # run` completes the whole dual-environment mission.
  cross-env:
    name: cross-env e2e (tudatpy 3.10 + gfold 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v4

      - name: Create locked CPU env (tudatpy, Python 3.10)
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: envs/cpu.conda-lock.yml
          environment-name: orbitopt
          cache-downloads: true

      - name: Install orbitopt in the tudat env (editable, no-deps)
        run: python -m pip install -e . --no-deps

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: envs/flightlab-landing-ci.txt

      - name: Build the Python 3.12 landing env (gfold 0.3.2) and install orbitopt
        run: |
          python3.12 -m venv .venv-landing
          .venv-landing/bin/python -m pip install -r envs/flightlab-landing-ci.txt
          .venv-landing/bin/python -m pip install -e . --no-deps

      - name: One command orchestrates both environments; provenance proves the split
        env:
          ORBITOPT_GFOLD_PYTHON: ${{ github.workspace }}/.venv-landing/bin/python
        run: |
          export ORBITOPT_TUDAT_PYTHON="${MAMBA_ROOT_PREFIX:?}/envs/orbitopt/bin/python"
          test -x "$ORBITOPT_TUDAT_PYTHON" && test -x "$ORBITOPT_GFOLD_PYTHON"
          pytest tests/test_crossenv.py tests/test_e505_reference.py -m cross_env -v

      - name: The standalone one-command CLI runs the same plan
        env:
          ORBITOPT_GFOLD_PYTHON: ${{ github.workspace }}/.venv-landing/bin/python
        run: |
          export ORBITOPT_TUDAT_PYTHON="${MAMBA_ROOT_PREFIX:?}/envs/orbitopt/bin/python"
          python -m orbitopt crossenv run --plan src/orbitopt/data/crossenv_e2e_plan.yaml \
            -o runs/crossenv-ci
          python -m orbitopt crossenv verify runs/crossenv-ci/ascent/exchange
          python -m orbitopt crossenv verify runs/crossenv-ci/recovery/exchange

      # E5-05 (task #272): the reference mission across the boundary. The
      # ascent leg replays the recorded computed ascent and evidences the
      # propagation in the tudatpy env; the recovery leg is DRIVEN from the
      # ascent leg's canonical separation handoff (E5-02 over E5-03).
      # crossenv-check grades the sealed recovery against the committed
      # reference, handoff identity included -- the proof that the two
      # environments branched from the one recorded state.
      - name: E5-05 reference mission replays across the boundary
        env:
          ORBITOPT_GFOLD_PYTHON: ${{ github.workspace }}/.venv-landing/bin/python
        run: |
          export ORBITOPT_TUDAT_PYTHON="${MAMBA_ROOT_PREFIX:?}/envs/orbitopt/bin/python"
          python -m orbitopt crossenv run --plan src/orbitopt/data/crossenv_e505_plan.yaml \
            -o runs/crossenv-e5-05
          python scripts/e505_reference.py crossenv-check runs/crossenv-e5-05

  test-macos:
    # Same locked CPU env on macOS: micromamba picks the osx-arm64 or osx-64
    # section of cpu.conda-lock.yml from the runner's native subdir. macOS
    # runners have a real window server, so Qt/VTK need no xvfb.
    name: test (CPU, ${{ matrix.subdir }}, locked env)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15        # Apple Silicon
            subdir: osx-arm64
            arch: arm64
          - os: macos-15-intel  # Intel x86_64
            subdir: osx-64
            arch: x86_64
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v4
      - name: Create locked CPU env
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: envs/cpu.conda-lock.yml
          environment-name: orbitopt
          cache-downloads: true
      - name: Check the env is native (${{ matrix.subdir }})
        run: test "$(python -c 'import platform; print(platform.machine())')" = "${{ matrix.arch }}"
      - name: Install orbitopt (editable, no-deps -- deps come from the lockfile)
        run: python -m pip install -e . --no-deps
      - name: Run test suite (no CUDA on macOS, so gpu-marked tests skip)
        run: pytest tests/ -v

  lockfile-drift:
    # Fails if envs/{cpu,gpu}.yml were edited without regenerating the
    # lockfiles. --check-input-hash only re-solves when the spec's hash
    # changed, so this is a no-op (seconds) on an untouched spec.
    name: lockfiles match envs/*.yml
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: lock
          create-args: conda-lock=4 python=3.12
          init-shell: bash
      - name: Check lockfiles are up to date
        run: |
          conda-lock lock --micromamba --check-input-hash \
            -f envs/cpu.yml -p linux-64 -p win-64 -p osx-64 -p osx-arm64 \
            --lockfile envs/cpu.conda-lock.yml
          conda-lock lock --micromamba --check-input-hash \
            -f envs/gpu.yml -p linux-64 -p win-64 \
            --virtual-package-spec envs/virtual-packages-gpu.yml \
            --lockfile envs/gpu.conda-lock.yml
          git diff --exit-code -- envs/ || {
            echo "::error::envs/*.conda-lock.yml are stale -- regenerate them (see envs/README.md)"
            exit 1
          }

  flightlab-gateb:
    # FL-601 slow regression job: the REAL pinned OpenTsiolkovsky binary
    # (fetched, SHA-256-verified -- never vendored) flies the reference
    # Gate B mission, and scripts/fl601_reference.py compares the result
    # against the committed outputs in tests/data/flightlab/reference/
    # with the declared tolerances. Fixture-based Flight Lab tests live in
    # the fast `test` job; this job is the only one that talks to OT.
    # Manual macOS-arm64 run: docs/flightlab-regression-ci.md.
    name: flightlab Gate B regression (real OT binary, linux-64)
    needs: test
    runs-on: ubuntu-latest
    # The M-07 and E5-01 steps below each optimize the ascent (cmaes 40x40,
    # 4 workers): measured 31 min on 8 cores / 8 workers each, so ~2x 60+
    # min on a 4-vCPU runner before env setup, Gate B and the tudatpy arc.
    # 120 min covered M-07 alone; E5-01's second acceptance run needs the
    # second optimization window.
    timeout-minutes: 180
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tag-check diffs the push/PR range

      - name: Create locked CPU env
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: envs/cpu.conda-lock.yml
          environment-name: orbitopt
          cache-downloads: true

      - name: Install orbitopt (editable, no-deps -- deps come from the lockfile)
        run: python -m pip install -e . --no-deps

      - name: Fetch the pinned OpenTsiolkovsky binary (SHA-256 verified)
        run: python scripts/fetch_opentsiolkovsky.py

      - name: Committed reference matches its provenance (G5 tamper check)
        run: python scripts/fl601_reference.py verify

      - name: Reference changes require an explicit tagged update (G5)
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            BASE=$(git merge-base "origin/${GITHUB_BASE_REF}" HEAD)
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            BASE="${{ github.event.before }}"
          else
            BASE=""
          fi
          python scripts/fl601_reference.py tag-check --base "$BASE"

      - name: Fly the Gate B reference mission and compare (declared tolerances)
        run: |
          python scripts/fl601_reference.py run --out "$RUNNER_TEMP/gateb"
          python scripts/fl601_reference.py compare "$RUNNER_TEMP/gateb"

      # M-07 (task #225): the two-stage LEO reference mission is the Gate B
      # flight pushed through the whole M-01..M-05 chain -- optimize the
      # ascent now, handoff-grade it, propagate the parking orbit with the
      # same locked env's tudatpy -- and requires the unified report to be
      # green. This job is the only one with binary + pygmo + tudatpy at
      # once, so the acceptance run lives here.
      - name: M-07 two-stage LEO reference mission end to end (task #225)
        run: pytest tests/test_mission_two_stage_leo.py -m slow -v

      # E5-01 (task #268): the same frozen mission flown again, and the
      # ascent INPUT itself audited -- every station, handoff and staging
      # state traced back into the computed OpenTsiolkovsky trajectory, raw
      # engine outputs shipped with the run, and the fast guards that keep
      # the synthetic E2-04 fixture the single annotated exception.
      - name: E5-01 real computed ascent through the full mission chain
        run: pytest tests/test_mission_e5_real_ascent.py -m slow -v
