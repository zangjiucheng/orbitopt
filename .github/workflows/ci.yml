name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: test (CPU, linux-64, locked env)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}

    steps:
      - uses: actions/checkout@v4

      # Qt/VTK need a real (if virtual) X server plus the GL/xcb runtime libs
      # PySide6's xcb platform plugin loads -- confirmed empirically (see
      # tests/test_app.py) that VTK's *offscreen* rendering path doesn't work
      # reliably for a live Qt window, but a real X display via xvfb does.
      - name: Install headless Qt/VTK runtime deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb \
            libgl1 \
            libegl1 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xfixes0 \
            libxcb-xinerama0

      # Installs the exact package set pinned in the CPU conda-lock file
      # (no solve at CI time). tudatpy is conda-forge/tudat-team only (no
      # PyPI wheels) and pins python=3.10 -- see envs/README.md.
      - name: Create locked CPU env
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: envs/cpu.conda-lock.yml
          environment-name: orbitopt
          # Cache package downloads, not the built env: the env cache is saved
          # after the test run, and a restored copy aborted on importing
          # tudatpy's extension modules (same lockfile, same package versions;
          # a fresh install of that lockfile ran fine).
          cache-downloads: true

      - name: Install orbitopt (editable, no-deps -- deps come from the lockfile)
        run: python -m pip install -e . --no-deps

      # FL-601: the Flight Lab suite must pass on the recorded fixtures
      # alone -- no OpenTsiolkovsky binary on this job (the adapter tests
      # use the recorded-output stub), and the committed Gate B reference
      # is checked for tampering here. The real-binary regression is the
      # separate flightlab-gateb job below.
      - name: Flight Lab unit tests on fixtures (no OT binary needed)
        run: >
          xvfb-run -a --server-args="-screen 0 1280x1024x24" pytest
          tests/test_flightlab_contract.py
          tests/test_flightlab_opentsiolkovsky.py
          tests/test_flightlab_simulate.py
          tests/test_flightlab_reference.py -v

      - name: Run test suite (gpu-marked tests skip here; see gpu.yml)
        run: xvfb-run -a --server-args="-screen 0 1280x1024x24" pytest tests/ -v

  test-macos:
    # Same locked CPU env on macOS: micromamba picks the osx-arm64 or osx-64
    # section of cpu.conda-lock.yml from the runner's native subdir. macOS
    # runners have a real window server, so Qt/VTK need no xvfb.
    name: test (CPU, ${{ matrix.subdir }}, locked env)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15        # Apple Silicon
            subdir: osx-arm64
            arch: arm64
          - os: macos-15-intel  # Intel x86_64
            subdir: osx-64
            arch: x86_64
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v4
      - name: Create locked CPU env
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: envs/cpu.conda-lock.yml
          environment-name: orbitopt
          cache-downloads: true
      - name: Check the env is native (${{ matrix.subdir }})
        run: test "$(python -c 'import platform; print(platform.machine())')" = "${{ matrix.arch }}"
      - name: Install orbitopt (editable, no-deps -- deps come from the lockfile)
        run: python -m pip install -e . --no-deps
      - name: Run test suite (no CUDA on macOS, so gpu-marked tests skip)
        run: pytest tests/ -v

  lockfile-drift:
    # Fails if envs/{cpu,gpu}.yml were edited without regenerating the
    # lockfiles. --check-input-hash only re-solves when the spec's hash
    # changed, so this is a no-op (seconds) on an untouched spec.
    name: lockfiles match envs/*.yml
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-name: lock
          create-args: conda-lock=4 python=3.12
          init-shell: bash
      - name: Check lockfiles are up to date
        run: |
          conda-lock lock --micromamba --check-input-hash \
            -f envs/cpu.yml -p linux-64 -p win-64 -p osx-64 -p osx-arm64 \
            --lockfile envs/cpu.conda-lock.yml
          conda-lock lock --micromamba --check-input-hash \
            -f envs/gpu.yml -p linux-64 -p win-64 \
            --virtual-package-spec envs/virtual-packages-gpu.yml \
            --lockfile envs/gpu.conda-lock.yml
          git diff --exit-code -- envs/ || {
            echo "::error::envs/*.conda-lock.yml are stale -- regenerate them (see envs/README.md)"
            exit 1
          }

  flightlab-gateb:
    # FL-601 slow regression job: the REAL pinned OpenTsiolkovsky binary
    # (fetched, SHA-256-verified -- never vendored) flies the reference
    # Gate B mission, and scripts/fl601_reference.py compares the result
    # against the committed outputs in tests/data/flightlab/reference/
    # with the declared tolerances. Fixture-based Flight Lab tests live in
    # the fast `test` job; this job is the only one that talks to OT.
    # Manual macOS-arm64 run: docs/flightlab-regression-ci.md.
    name: flightlab Gate B regression (real OT binary, linux-64)
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tag-check diffs the push/PR range

      - name: Create locked CPU env
        uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: envs/cpu.conda-lock.yml
          environment-name: orbitopt
          cache-downloads: true

      - name: Install orbitopt (editable, no-deps -- deps come from the lockfile)
        run: python -m pip install -e . --no-deps

      - name: Fetch the pinned OpenTsiolkovsky binary (SHA-256 verified)
        run: python scripts/fetch_opentsiolkovsky.py

      - name: Committed reference matches its provenance (G5 tamper check)
        run: python scripts/fl601_reference.py verify

      - name: Reference changes require an explicit tagged update (G5)
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            BASE=$(git merge-base "origin/${GITHUB_BASE_REF}" HEAD)
          elif [ "$GITHUB_EVENT_NAME" = push ]; then
            BASE="${{ github.event.before }}"
          else
            BASE=""
          fi
          python scripts/fl601_reference.py tag-check --base "$BASE"

      - name: Fly the Gate B reference mission and compare (declared tolerances)
        run: |
          python scripts/fl601_reference.py run --out "$RUNNER_TEMP/gateb"
          python scripts/fl601_reference.py compare "$RUNNER_TEMP/gateb"
