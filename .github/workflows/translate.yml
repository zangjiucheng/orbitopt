name: Translate documentation

on:
  push:
    branches: [main]
    paths:
      - README.md
      - docs/**/*.md
      - scripts/translate_docs.py
      - scripts/install_argos_model.py
      - scripts/publish_translation_draft.py
      - requirements-translation.txt
      - .github/workflows/translate.yml
  workflow_dispatch:
    inputs:
      force:
        description: Retranslate all English sources
        type: boolean
        default: false

concurrency:
  group: translate-zh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  translate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ARGOS_DEVICE_TYPE: cpu
      ARGOS_INTRA_THREADS: '2'
      XDG_DATA_HOME: ${{ github.workspace }}/.translation-data
      XDG_CACHE_HOME: ${{ github.workspace }}/.translation-cache
      OMP_NUM_THREADS: '2'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-translation.txt
      - name: Cache Argos model data
        uses: actions/cache@v4
        with:
          path: |
            .translation-data
            .translation-cache
          key: argos-en-zh-1.9-${{ runner.os }}-${{ hashFiles('requirements-translation.txt', 'scripts/install_argos_model.py') }}
      - name: Install CPU translation engine and English-to-Chinese model
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-translation.txt
          python scripts/install_argos_model.py
      - name: Translate changed English documents and validate structure
        id: translate
        env:
          FORCE: ${{ inputs.force || false }}
        run: |
          args=()
          if [ "$FORCE" = true ]; then args+=(--force); fi
          python scripts/translate_docs.py "${args[@]}"
      - name: Upload Chinese review drafts
        id: drafts
        uses: actions/upload-artifact@v4
        with:
          name: chinese-documentation-drafts
          path: translations/zh/
          include-hidden-files: true
          retention-days: 14
      - name: Publish the translation review branch
        id: publish
        run: python scripts/publish_translation_draft.py
      - name: Link translation review outputs
        env:
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          ARTIFACT_URL: ${{ steps.drafts.outputs.artifact-url }}
          HAS_CHANGES: ${{ steps.publish.outputs.has_changes }}
        run: |
          {
            echo '## Chinese translation drafts'
            printf 'Download: [Chinese review copies](%s)\n\n' "$ARTIFACT_URL"
            if [ "$HAS_CHANGES" = true ]; then
              printf 'Browse: [draft branch](%s/tree/automation/translate-zh/translations/zh)\n\n' "$REPOSITORY_URL"
              printf 'Review: [create a pull request](%s/compare/main...automation/translate-zh?expand=1)\n\n' "$REPOSITORY_URL"
            else
              echo 'No translation changes need review.'
            fi
            echo 'English remains authoritative. Review terminology, numbers and review.json before merging.'
          } >> "$GITHUB_STEP_SUMMARY"
