name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/orbitopt/**"
      - "scripts/generate_api_reference.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Only one Pages deployment at a time; a newer push cancels an in-flight one
# rather than queuing behind it -- the site should always reflect the latest
# main, not an interleaving of two.
concurrency:
  group: "pages"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
    steps:
      - uses: actions/checkout@v4

      # API pages are generated from Python source and schemas without imports.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # docs/ is a Jekyll 4 site (Just the Docs theme; docs/_config.yml),
      # gems pinned by docs/Gemfile.lock. The landing page (index.html) has
      # no front matter and is copied as-is; everything else is rendered.
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: docs

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build the site
        working-directory: docs
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"

      - name: Upload the built site as the Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages
          path: docs/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Upload finalization can precede artifact metadata visibility. Start
      # deployment in a dependent job and require this build's exact artifact.
      - name: Wait for the uploaded Pages artifact
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$PAGES_ARTIFACT_ID" =~ ^[0-9]+$ ]] || {
            echo "::error::The build returned no valid Pages artifact ID"
            exit 1
          }
          for attempt in {1..6}; do
            if visible=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$PAGES_ARTIFACT_ID" \
              --jq '.name == "github-pages" and .expired == false'); then
              if [[ "$visible" == true ]]; then
                echo "Pages artifact $PAGES_ARTIFACT_ID is available"
                exit 0
              fi
            fi
            echo "Waiting for Pages artifact metadata ($attempt/6)"
            if (( attempt < 6 )); then sleep 5; fi
          done
          echo "::error::The uploaded github-pages artifact is still unavailable"
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
