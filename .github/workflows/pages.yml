name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "src/orbitopt/**"
      - "scripts/generate_api_reference.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Only one Pages deployment at a time; a newer push cancels an in-flight one
# rather than queuing behind it -- the site should always reflect the latest
# main, not an interleaving of two.
concurrency:
  group: "pages"
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # API pages are generated from Python source and schemas without imports.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # docs/ is a Jekyll 4 site (Just the Docs theme; docs/_config.yml),
      # gems pinned by docs/Gemfile.lock. The landing page (index.html) has
      # no front matter and is copied as-is; everything else is rendered.
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: docs

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build the site
        working-directory: docs
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"

      - name: Upload the built site as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
