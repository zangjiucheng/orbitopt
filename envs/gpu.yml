# CUDA orbitopt environment spec: cpu.yml + CuPy on CUDA 13. Edit this, then
# regenerate gpu.conda-lock.yml (see envs/README.md) -- install from the lockfile.
# Keep the shared dependency list identical to cpu.yml.
name: orbitopt-gpu
channels:
  - conda-forge
  - tudat-team
dependencies:
  - python=3.10
  - tudatpy=1.0  # declares its boost (1.84) and numpy pins; 0.9.0 links
                 # libboost 1.85 undeclared and no longer imports
  - pykep
  - pygmo
  - numpy>=1.26.4,<2  # tudatpy 1.0.0 requires numpy<2.0 (its real conda pin)
  - scipy>=1.11,<1.14  # pykep.trajopt still calls scipy.interpolate.interp2d (gone in 1.14)
  - matplotlib=3.9.2
  - astropy=6.1.7  # flightlab frame bridge (FL-002): ITRS<->GCRS at the
                   # launch epoch; imported lazily so the base package still
                   # works without it. Pinned exactly (FL-601).
  - notebook
  - pytest
  - pip
  - pyvista
  - pyside6
  - pyvistaqt
  - cupy
  - cuda-version=13
