# E5-08 (task #296) NEW-VEHICLE flight target: the E5-08 DESIGN
# starship_class_rtls_dc7 -- E5-08b: the E5-08 design plus DC7, an earlier stage-1 cutoff (derived from the E5-07 reference
# starship_class_public_estimate by the DC1 powered-entry recovery scheme)
# from Kourou to a 250 km LEO with the booster recovered RTLS to the pad.
#
# CONSTRAINT INHERITANCE (E5-08 acceptance): every constraint below is the
# E5-07 number, copied unchanged -- nothing is relaxed for the new vehicle.
#
# This is the second of the epic-P0's two reference classes (the split E5-07
# records in docs/physics-qualification.md):
#   * SOFTWARE INTEGRATION REFERENCE -- E5-05 / synthetic_two_stage_rtls:
#     synthetic vehicle, constraints relaxed with ADR-recorded reasons; it
#     verifies the toolchain end to end and must never be quoted as an
#     engineering validation of a real vehicle;
#   * PHYSICS QUALIFICATION REFERENCE -- this file: every constraint below
#     carries a public source or is tagged ASSUMPTION with its reason. The
#     mission is graded as flown: a constraint that the computed flight
#     breaks is reported as broken (vehicle capability / guidance /
#     constraint reasons in the E5-07 report), never relaxed to close it.
#
# Site: Kourou, the E5 reference-site decision (same site as the E5-05
# reference, so the two reference classes differ in the vehicle and the
# constraint basis, not in the range geometry). Epoch: the E5-05 mission
# epoch -- a past date, finalized IERS, no extrapolated EOPs.
schema_version: '1.0'
mission:
  id: leo-starship-class-rtls-e5-08-dc7
  title: Starship-class RTLS-derived design LEO insertion + booster powered-entry RTLS (E5-08 new-vehicle design)
  epoch_utc: '2026-11-10T12:00:00Z'
launch_site:
  name: kourou
  latitude_deg: 5.2392
  longitude_deg: -52.7685
  altitude_wgs84_m: 15.0
target_orbit:
  central_body: Earth
  periapsis_altitude_m: 250000
  apoapsis_altitude_m: 250000
  inclination_deg: 51.6
  raan_deg: null  # null means unconstrained; may constrain when mission requires it
constraints:
  # PUBLIC SOURCE: SpaceX live broadcast telemetry showed the Block 1
  # Starship booster passing Max-Q at ~50-55 kPa on the integrated flight
  # tests (the on-screen Max-Q marker, April 2023 flight). Ceiling set at the
  # top of the reported band, not widened; the +-30 % aerodynamic model band
  # (nose_aero) is carried as the sensitivity range in the E5-07 reference,
  # not by widening the limit.
  max_dynamic_pressure_pa: 55000
  # ASSUMPTION (no public value exists): Starship's structural axial-load
  # allowable has never been published. 3.0 g at engine cutoff corresponds to
  # the ~0.35 bar common-dome pressurisation head margin stated for the
  # vehicle class and to the load cases implied by the published boostback /
  # landing throttle schedules; it is NOT relaxed from a higher number. If
  # the computed ascent exceeds it, that is reported as a broken constraint
  # (the fixed-thrust OT profile has no MECO throttle authority), not a
  # ceiling to move.
  max_specific_acceleration_g: 3.0
  # The insertion verdict bands mirror the E5-05 mission gates (F9 closure
  # band, ADR-0008): the delivered orbit must hold a 230 km floor and close
  # inside |a - 250 km| < 60 km and 1 deg of plane. These are mission
  # closures, not vehicle relaxations: the graded insertion is reported with
  # its residuals either way.
  minimum_insertion_periapsis_m: 230000
  orbit_altitude_tolerance_m: 60000
  inclination_tolerance_deg: 1.0
recovery:
  kind: rtls
  target: launch_site
  # PUBLIC SOURCE (order of magnitude): the launch-mount catch is flown at a
  # soft touchdown -- SpaceX's catch-vehicle statements describe the booster
  # arriving at the tower essentially at rest between the chopsticks; a
  # 3 m/s vertical / 1 m/s lateral band is the same engineering read the
  # E5-05 reference grades against and is tagged DESIGN ASSUMPTION here
  # because SpaceX publishes no touchdown-speed figure.
  max_touchdown_speed_m_s: 3.0  # DESIGN ASSUMPTION (public behaviour: soft catch), see assumptions
  max_touchdown_lateral_speed_m_s: 1.0  # DESIGN ASSUMPTION, see assumptions
  # ASSUMPTION with source-basis: Block 1 Super Heavy is publicly described
  # as landing with on the order of 200 t of unburned propellant (the
  # residual-at-MECO figures discussed with the catch flights; the vehicle
  # file's landing reserve is 150 t as a model planning margin). The GRADED
  # number here is the mission requirement -- one landing burn's worth plus
  # margin -- computed at 1.5 x the single landing-burn need (13 Raptors at
  # the 40 % floor, 327 s sea-level Isp, from the entry handoff ~250 m/s):
  # ~90 t, so 100 t. Not relaxed from the vehicle model's reserve.
  min_propellant_reserve_kg: 100000
vehicle:
  source: vehicles/starship_class_rtls_dc7.yaml
  provenance: public_estimate
simulation:
  ascent_backend: opentsiolkovsky
  atmosphere_6dof_backend: jsbsim
  orbit_verify_backend: tudatpy
  enabled_phases: [ascent_3dof, orbit_verify]
assumptions:
  - "E5-08b (DC7): this scenario is the E5-08 flight target with the vehicle swapped for starship_class_rtls_dc7 (earlier stage-1 cutoff, longer ship burn, re-tuned pitch program). EVERY constraint below is identical to the E5-08 / E5-07 flight target -- the diff against leo_starship_class_rtls_e508.yaml is the id, the vehicle source line and this note."
  - "Constraint basis (E5-07): every limit above is PUBLIC SOURCE or ASSUMPTION as commented; none was widened to make the computed flight close. Vehicle-parameter uncertainty (generated aero +-30 %, nose length +-30 % assumption) is recorded as the SENSITIVITY RANGE of the reference, quantified in the E5-07 sensitivity record (scripts/e507_reference.py sensitivity), not by loosening a limit."
  - "q*alpha structural load (a Starship-class sizing case the E5-05 fixture never carried): the reference does not impose an unpublished allowable as a number. It is qualified as a REPORTED load -- the ascent run carries q and the attitude program's angle of attack (gravity-turn: beta ~ 0, q*alpha ~ 0 by construction of the commanded program), and the sensitivity record evaluates the +-30 % aerodynamic band on the same trajectory. The entry cross-check is reported separately as not-closable with the current guidance chain (see the E5-07 report)."
  - "Thrust-to-weight ratio: liftoff TWR of the declared stack is 74.93 MN vacuum thrust (33 x Raptor 2 at 95 %, derived from the published 2.256 MN sea-level figure) on 3,525 t at pad -> 2.17 vacuum / ~1.95 sea-level-class; the published Block 1 liftoff TWR is ~1.5. The OT backend flies the declared full-thrust burn window (no throttle authority), so the declared thrust curve -- not a mission gate -- carries this figure; it is reported in the E5-07 record as a vehicle-capability note."
  - "The vehicle flies its DECLARED attitude program and burn windows (fixed-program OT flight; the program in the vehicle file is an authored gravity-turn-style profile, scenario choice, tagged illustrative there)."
  - "Booster RTLS (design change DC1, E5-08): the vehicle models THREE relightable ignitions (boostback, ONE powered entry burn, landing), the profile the shipped E3 chain plans, flies and grades; the E5-07 gap report's restart-2 aerodynamic-entry profile is not expressible in FL-302 and is NOT claimed here. Entry-phase planning limits (250 kPa / 12 g) are ADR-0008 DESIGN ASSUMPTIONs -- planning knobs, not graded constraints; the graded recovery numbers (touchdown 3 m/s vertical / 1 m/s lateral, reserve 100 t) are the E5-07 values, unchanged."
  - "Constraint basis inherited from the E5-07 reference unchanged (E5-08 acceptance rule): no limit was widened for the new vehicle; a computed violation is reported with its reason class (vehicle capability / guidance / constraint), not fixed by editing this file."
