# E11-06: the sealed Starbase DC7-derived design (starship_class_rtls_starbase.yaml, unchanged) plus a V3-class grid-fin block
# on the booster; every other field is identical. The fin drag calibration is a DESIGN ASSUMPTION (see grid_fins.assumptions).
schema_version: flight-vehicle-1.0
name: starship-class-rtls-starbase-fins-v1
provenance: public_estimate
as_of: 2026-11
disclaimer: 'Derived DESIGN on the public-estimate Starship-class stack of starship_class_public_estimate.yaml: inherited
  figures keep that file''s public-estimate tags; every design change is tagged illustrative with its reason. Not official
  SpaceX performance data and never to be presented as such.

  '
assumptions:
- 'DC1 recovery scheme (DESIGN CHANGE): three relightable ignitions after separation (boostback, one throttled powered entry
  burn, landing burn) with the 13-engine relight set usable for all three phases. Reason: the E5-07 RECOVERY_GAP.md -- the
  reference''s boostback + aerodynamic entry + landing needs 2 ignitions with an UNPOWERED entry the FL-302 planner cannot
  represent, so the reference mission declares no recovery stage; a powered entry (entry_burns = 1) is the closest profile
  the shipped chain plans, flies and grades, and powered entry deceleration is public behaviour of the class (the flip-and-burn
  deceleration of the Starship flight tests, the landing burn of Falcon 9). Entry-phase planning limits (250 kPa / 12 g) are
  the ADR-0008 DESIGN ASSUMPTIONs the E5-05c/E7 campaign carries.'
- 'DC7 stage-1 cutoff and separation (replaces the inherited DC2 burn window): MECO at 123 s and separation at 126 s (the
  inherited vehicle cuts off at 135 s / 138 s). Reason: the E5-08 record (RECOVERY_GAP_E508.md) found the powered-entry recovery
  leg short of the graded reserve at the inherited staging point; a global search over the booster script (150+ evaluations
  per generation on two staging points) showed the binding limit is the propellant the booster carries into the recovery leg.
  An earlier cutoff (120 s against the inherited 135 s) leaves it ~248 t more propellant at separation, and the graded reserve
  (100 t) is met at the corridor with the inherited limits unchanged. Cost, not hidden: the ship has to make up the speed.'
- 'DC7 stage-2 burn window and pitch program (replaces the inherited DC3): the ship burns 387.891 s (inherited 378 s) from
  its spare propellant, and the post-MECO elevation nodes (155-445 s) are re-tuned, searched with the same fixed-program OpenTsiolkovsky
  flight so that every inherited ascent limit still holds (periapsis >= 230 km, apoapsis inside 250 +/- 60 km, inclination
  30.5 +/- 1 deg, 3.0 g, max-Q 55 kPa). The ship keeps ~102.5 t for deorbit and landing instead of ~118.8 t: that is the price
  of the booster''s reserve, reported in the comparison record, not absorbed.'
- 'DC4 nose geometry and aero: UNCHANGED (13.5 m tangent ogive assumption, +-30 %, tables regenerated from the nose by orbitopt.flightlab.nose_aero
  and held equal by test). Reason: keeping the aero identity makes the Max-Q / peak-g comparison between reference and derived
  vehicle isolate DC1; a nose change would move both and confound the report.'
- 'DC5 stage masses, engines (33 x Raptor 2 stage-1 set at the 95 % figure; 6-engine ship; 13-engine relight set at the 40
  % floor) and launch site / epoch: UNCHANGED. Reason: the task inherits the E5-07 sourced constraint set; re-sizing stages
  or engines without a new public basis would break the provenance rule (every parameter sourced or a reasoned DESIGN ASSUMPTION).'
- Block 1 figures throughout, Raptor 2 at 2.256 MN sea-level / 327 s SL Isp / 350 s vacuum, ship set at the thrust-weighted
  365 s effective Isp -- inherited one for one from starship_class_public_estimate.yaml, with the same source caveats (public
  disagreement on the vacuum Isp figure; the nose length is an assumption with no public value).
- The booster section models its relightable engines as one set; the real vehicle shuts down toward 3 engines for the last
  seconds of the landing burn, which one engine set cannot express (inherited limitation; the E8-05 landing comparison declares
  its 3-engine landing configuration).
