# Flight Lab vehicle: synthetic two-stage LEO booster (FL-004).
# Adapter input for orbitopt.flightlab.adapters.opentsiolkovsky: 'stages' are
# OpenTsiolkovsky stage configs (validated against OT's own schema at config
# build time); 'attitude_program' fills OT's attitude curves unless a call
# overrides it. All figures are hand-tuned placeholders for the FL-004/FL-005
# pipeline -- NOT a real vehicle (provenance: illustrative).
# The 'booster:' section (FL-301) is the stage-1 recovery model read by
# orbitopt.flightlab.recovery.propagator.BoosterModel.load; it is not passed
# to the OT adapter.
# FL-602: this document validates against data/flightlab/schemas/
# flight-vehicle-1.0.json; 'data_provenance:' tags every number in the file
# (a key covers the node or subtree it names -- see
# orbitopt.flightlab.vehicle_catalog). The stage-1 thrust/Isp/Cd uncertainty
# bands are the default FL-304 Monte Carlo dispersions for this vehicle.
schema_version: flight-vehicle-1.0
name: synthetic-two-stage
provenance: illustrative
as_of: "2026-11"
assumptions:
  - Hand-tuned two-stage demonstrator sized for a ~400 km / 51.6 deg insertion
    from LC-39A within the FL scenario constraints (max_q 60 kPa, 5 g); the
    single-burn cutoff leaves ~130 km of apogee above perigee -- closing the
    circle is E2 optimizer headroom, not a vehicle defect.
  - Stage separation and engine restart follow a Falcon-9-style sequence; the
    stage-1 throttle-down near MECO keeps thrust acceleration under 5 g;
    aero is a generic tube-and-fins guess.
simulation:
  end_time_s: 950.0
  output_step_s: 2.0
  integrator: {method: rk45}
attitude_program:
  - {t_s: 0.0, azimuth_deg: 45.4, elevation_deg: 90.0}
  - {t_s: 30.0, azimuth_deg: 45.4, elevation_deg: 87.0}
  - {t_s: 60.0, azimuth_deg: 45.4, elevation_deg: 72.0}
  - {t_s: 90.0, azimuth_deg: 45.4, elevation_deg: 57.0}
  - {t_s: 120.0, azimuth_deg: 45.4, elevation_deg: 44.0}
  - {t_s: 160.0, azimuth_deg: 45.4, elevation_deg: 30.0}
  - {t_s: 214.0, azimuth_deg: 45.4, elevation_deg: 26.0}
  - {t_s: 340.0, azimuth_deg: 45.4, elevation_deg: 16.0}
  - {t_s: 400.0, azimuth_deg: 45.4, elevation_deg: 4.0}
  - {t_s: 440.0, azimuth_deg: 45.4, elevation_deg: 0.0}
  - {t_s: 620.0, azimuth_deg: 45.4, elevation_deg: 0.0}
stages:
  - mass_initial_kg: 380000.0
    mass_dry_kg: 30000.0
    engine:
      thrust_vac_n: [[0.0, 6800000.0], [100.0, 6800000.0], [115.0, 3900000.0], [200.0, 3900000.0]]
      isp_vac_s: 311.0
      burn_start_s: 0.0
      burn_end_s: 200.0
      nozzle_exit_area_m2: 5.0
    aero:
      diameter_m: 3.7
      ca: [[0, 0.35], [0.8, 0.38], [1.1, 0.55], [1.5, 0.5], [2.5, 0.4], [4, 0.32], [8, 0.26]]
      cn_alpha_per_rad: 0.2
      ballistic_coefficient_kg_m2: 120
    free_flight: attitude_program
    separation_time_s: 207.0
  - mass_initial_kg: 55000.0
    mass_dry_kg: 8500.0
    engine:
      thrust_vac_n: 340000.0
      isp_vac_s: 350.0
      burn_start_s: 7.0
      burn_end_s: 413.0
      nozzle_exit_area_m2: 1.2
    aero:
      diameter_m: 3.7
      ca: [[0, 0.35], [0.8, 0.38], [1.1, 0.55], [1.5, 0.5], [2.5, 0.4], [4, 0.32], [8, 0.26]]
      cn_alpha_per_rad: 0.2
      ballistic_coefficient_kg_m2: 120
    free_flight: attitude_program
    jettisons:
      - name: fairing
        time_s: 60.0
        mass_kg: 1500.0
        ballistic_coefficient_kg_m2: 40
booster:
  # Stage-1 recovery article as flown by the E3 3-DOF propagator. Masses and
  # aero mirror the stage-1 OT config (same tube-and-fins tube, same dry
  # mass); the landing engine is a single relightable Merlin-class unit --
  # sized so hover authority holds at dry mass with the landing reserve.
  provenance: illustrative
  dry_mass_kg: 30000.0
  landing_propellant_reserve_kg:
    value: 4200.0
    source: sized for a boostback + entry burn + landing burn at 2x hover margin (illustrative)
  reference_area_m2:
    value: 10.7516
    source: pi/4 * 3.7^2, stage-1 diameter (illustrative)
  cd_mach:
    source: stage-1 OT aero ca table (illustrative)
    value: [[0.0, 0.35], [0.8, 0.38], [1.1, 0.55], [1.5, 0.5], [2.5, 0.4], [4.0, 0.32], [8.0, 0.26]]
  engines:
    count: 1
    usable_for: [boostback, landing]
    thrust_vacuum_n: 1800000.0
    isp_sea_level_s: 282.0
    isp_vacuum_s: 311.0
    nozzle_exit_area_m2: 5.0
    throttle_min: 0.4
    throttle_max: 1.0
    restarts_max: 3
  assumptions:
    - Single relightable engine may be a deep-throttled subset of the sea-level
      engine cluster; modelled as one unit with its own vacuum thrust/Isp pair.
    - The OT stage-1 config burns all propellant by separation, so the recovery
      reserve is planning headroom for the E3 burn sequence, not a state the
      FL-004 ascent scenario carries.
data_provenance:
  # Every entry is authored for this repository's demonstrator pipeline:
  # plausible round numbers, no claim to match any real vehicle, so
  # 'source' names the authoring intent and 'as_of' the last review.
  simulation:
    provenance: illustrative
    source: sized for the FL-004/FL-005 scenario window (hand-tuned)
    as_of: "2026-11"
  attitude_program:
    provenance: illustrative
    source: hand-tuned gravity turn for the FL scenario constraints (not guidance-derived)
    as_of: "2026-11"
  stages[0]:
    provenance: illustrative
    source: hand-tuned stage-1 sized for ~400 km insertion within FL constraints
    as_of: "2026-11"
  stages[0].engine.thrust_vac_n:
    provenance: illustrative
    source: hand-tuned Merlin-class cluster total with MECO throttle-down
    as_of: "2026-11"
    uncertainty_pct: 5.0
  stages[0].engine.isp_vac_s:
    provenance: illustrative
    source: hand-tuned Merlin-class vacuum Isp
    as_of: "2026-11"
    uncertainty_pct: 3.0
  stages[0].aero.ca:
    provenance: illustrative
    source: generic tube-and-fins Cd(Mach) guess
    as_of: "2026-11"
    uncertainty_pct: 8.0
  stages[1]:
    provenance: illustrative
    source: hand-tuned upper stage sized for the single-burn cutoff
    as_of: "2026-11"
  booster:
    provenance: illustrative
    source: mirrors the illustrative stage-1 OT config; reserve sized for 2x hover margin
    as_of: "2026-11"

