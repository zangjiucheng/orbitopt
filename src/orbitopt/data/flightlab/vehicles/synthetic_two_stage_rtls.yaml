# E5-05a (task #285): RTLS-capable redesign of the synthetic two-stage LEO
# vehicle. Structural copy of the sealed synthetic_two_stage.yaml (same OT
# config-generator surface + booster section), with the E5-05a redesign:
#   * stage-1 propellant 590 t (2x) + a declared burn_end_s cutoff -> the
#     separation state carries a COMPUTED ~193 t propellant reserve (the
#     sealed baseline burns to depletion: ContextDB record
#     `e5-05-rtls-infeasibility-evidence`, task #272);
#   * stage-2 redesigned for the insertion margin at ignition TWR ~2.0;
#   * booster landing cluster: 3 units + 15 t reserve for a real flight.
# All numbers are design-derived in this repository (optimization campaign +
# recovery-budget probes, docs/adr/flightlab-0008); the 'illustrative' tier is
# the schema's only non-real tier (flight-vehicle-1.0.json).
schema_version: flight-vehicle-1.0
name: synthetic-two-stage-rtls
provenance: illustrative
as_of: 2026-11
assumptions:
- 'E5-05a redesign (task #285): stage-1 propellant load 590 t (2x the sealed 350 t) and a declared burn_end_s cutoff
  at 134 s (depletion-independent), so MECO/separation carry a COMPUTED 136.7 t separation mass = 106.7 t RTLS propellant
  reserve instead of burning to depletion; the recovery chain plans from this computed state and the propellant-reserve
  gate PASSES (13.6 t at touchdown, docs/adr/flightlab-0008).'
- Stage-1 tube widened to 5.2 m for the 2x propellant load; same Cd(Mach) table and same 30 t dry mass as the sealed
  baseline; lofted MECO (elevation 44 deg at burn end, burn extended to 134 s) carries separation to ~90 km / 2.3
  km/s / 120 km downrange - the ~180 t-class separation regime task
- 'Stage-2 12 t dry (0.935 mass fraction, C/LiAl class), 85 t wet, 6.2->2.8 MN lazy profile: burnout flight-path
  angle is the binding constraint (F6/F9): the reference flight reaches rp -0.74 km / ra 5696 km at SECO, the best
  perigee the OpenTsiolkovsky 1.1.0 single-burn backend achieves from a reserve-carrying separation state; closing
  the 250 km insertion band needs a coast/restart capability the backend does not expose (F9, docs/adr/flightlab-0008).'
- Landing reserve 15 t (planning margin carried by the booster model); the graded minimum is the flight target's
  recovery.min_propellant_reserve_kg.
- 'Derived-not-copied design: campaign + recovery-budget provenance in docs/adr/flightlab-0008.'
