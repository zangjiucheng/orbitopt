schema_version: flight-vehicle-1.0
name: synthetic-two-stage-rtls
provenance: illustrative
as_of: 2026-11
assumptions:
- 'E5-05a redesign (task #285): stage-1 propellant load 590 t (2x the sealed 350 t) and a declared
  burn_end_s cutoff at 134 s (depletion-independent), so MECO/separation carry a COMPUTED 135.6
  t separation mass = 105.6 t RTLS propellant reserve instead of burning to depletion; the recovery
  chain plans from this computed state and the propellant-reserve gate PASSES (13.2 t at touchdown,
  docs/adr/flightlab-0008).'
- 'E5-05d (#288) upper-stage redesign: 128 t wet / 8.5 t dry stage-2 at Isp 380 s with a 14 MN
  boost leg, a declared cutoff into a coast + re-ignition circularisation burn (E5-05b restart
  block); all numbers from the OpenTsiolkovsky insertion-band campaign closing F9 -- the computed
  ascent reaches rp 281.8 km / ra 296.1 km at SECO from the computed reserve-carrying separation
  state (docs/adr/flightlab-0008)'
- Stage-1 tube widened to 5.2 m for the 2x propellant load; same Cd(Mach) table and same 30 t
  dry mass as the sealed baseline; lofted MECO (elevation 44 deg at burn end, burn extended to
  134 s) carries separation to ~90 km / 2.3 km/s / 120 km downrange - the ~180 t-class separation
  regime task
- Landing reserve 15 t (planning margin carried by the booster model); the graded minimum is the
  flight target's recovery.min_propellant_reserve_kg.
- 'Derived-not-copied design: campaign + recovery-budget provenance in docs/adr/flightlab-0008.'
