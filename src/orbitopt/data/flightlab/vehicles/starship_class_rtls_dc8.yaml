# Flight Lab vehicle: E10-02 HOT-STAGING design DC8, derived from the E5-08
# design starship_class_rtls_dc7.yaml (which is derived from
# starship_class_public_estimate.yaml, the E5-07 physics-qualification
# reference). Same public-estimate stack and the same sourced ascent limits;
# the DC8 design changes below are the E10-02 staging work, each tagged in
# 'data_provenance:' and reasoned in 'assumptions:'. (flight-vehicle-1.0,
# orbitopt.flightlab.vehicle_catalog)
#
# Design changes vs the E5-07 reference (the E5-07 RECOVERY_GAP.md is the
# starting point: the reference's restart-2 aerodynamic-entry RTLS profile has
# no representation in the FL-302 planner, which accepts 1 + entry_burns
# ignitions, entry_burns in {1, 2}):
#  * DC1 (recovery scheme): the booster returns on a POWERED entry --
#    boostback, ONE throttled entry burn, landing burn: three ignitions,
#    restarts_max 3, relight set usable_for [boostback, entry, landing].
#    This is the F9-heritage architecture (boostback + landing burn) extended
#    by the powered entry deceleration SpaceX has flown on Starship flight
#    tests; it is the profile the shipped E3 chain can plan and fly, so the
#    recovery leg CLOSES instead of being reported as a gap.
#  * DC7 (staging point, E5-08b): stage-1 cutoff 12 s EARLIER (MECO 135 -> 123 s,
#    separation 138 -> 126 s), the ship burns 388.7 s instead of 378 s to make up
#    the speed from its spare propellant, and the post-MECO pitch program is
#    re-tuned so the SAME insertion band, 3.0 g and max-Q limits hold. Cost,
#    stated plainly: the ship keeps ~100 t instead of ~119 t for deorbit/landing
#    and the booster separates 164 t heavier, 202 m/s slower, 11 km lower -- the
#    recovery leg gets the propellant it needs without touching any graded limit.
#  * DC8-1 (throttled MECO, E10-02): stage-1 thrust no longer cuts off at a
#    mid-throttle level. The DC7 schedule's 101 s step (74.93 -> 62.0 MN) and
#    the ~77 % cutoff at 123 s are replaced by a continuous throttle-down to
#    the declared 40 % floor (29.97 MN, the 13-engine relight set's level):
#    100-105 s 74.93 -> 62.0 MN (3.5 %/s of peak), 105-116 s hold, 116-125.5 s
#    ramp to the floor (4.5 %/s of peak), shutoff at the floor. Slew stays
#    inside the declared
#    5 %/s assumption (public Raptor sources give the 40-100 % range, not a
#    slew rate); no commanded step remains before MECO.
#  * DC8-2 (hot staging, E10-02): the ship lights at 124.0 s while the stages
#    are still connected, separation follows at 125.0 s, and the booster's
#    MECO closes the sequence at 125.5 s -- the DC7 3-s unpowered coast
#    between MECO and separation is gone. Event order: throttle-down, ship
#    ignition, separation, booster MECO (the 'staging:' block is the single
#    authority; orbitopt.flightlab.hot_staging validates it and every model
#    reads the same timeline). The 1-s mated ship burn pushes the stack with
#    a declared 4 % axial plume-interference loss (simplified model,
#    assumption); the M-01 handoff and the split bookkeeping see the ship
#    already burning at separation (stage-2 initial mass minus the overlap
#    propellant, 4.13 t).
#  * DC8-3 (ship burn window): same duration and same SECO (388.663 s on the
#    ship's own engine clock as in DC7), but it starts 1.0 s earlier, so OT
#    SECO lands at 512.663 s instead of 514.663 s; the final 5.663 s burn on
#    3 engines (4.428 MN, an engine-out cut of the 4-engine set, inside the
#    declared throttle floor) and the -1.5 deg tail node at 508 s replace the
#    ~25 m/s of excess insertion energy the mated-phase boost adds, and the
#    post-staging attitude nodes ride the ship clock (-2.0 s absolute shift);
#    searched with the same fixed-program flight, insertion closes the
#    inherited band and the ship keeps 103.5 t (DC7: 101.2 t).
#  * DC2, DC4, DC5 (stage masses, engines, nose): UNCHANGED from the
#    reference, deliberately -- see assumptions. Max-Q and peak-g comparisons
#    therefore isolate the recovery change from ascent drift, and the +-30 %
#    generated-aero sensitivity band of the reference carries over verbatim.
schema_version: flight-vehicle-1.0
name: starship-class-rtls-dc8-v1
provenance: public_estimate
as_of: "2026-11"
disclaimer: >
  Derived DESIGN (DC8) on the DC7/E5-07 public-estimate Starship-class
  stack: inherited figures keep that file's public-estimate tags; every
  design change is tagged illustrative with its reason. The hot-staging
  timings are a design, not flown data -- not official SpaceX performance
  data and never to be presented as such.
assumptions:
  - >-
      DC1 recovery scheme (DESIGN CHANGE): three relightable ignitions after separation
      (boostback, one throttled powered entry burn, landing burn) with the 13-engine
      relight set usable for all three phases. Reason: the E5-07 RECOVERY_GAP.md -- the
      reference's boostback + aerodynamic entry + landing needs 2 ignitions with an
      UNPOWERED entry the FL-302 planner cannot represent, so the reference mission
      declares no recovery stage; a powered entry (entry_burns = 1) is the closest profile
      the shipped chain plans, flies and grades, and powered entry deceleration is public
      behaviour of the class (the flip-and-burn deceleration of the Starship flight tests,
      the landing burn of Falcon 9). Entry-phase planning limits (250 kPa / 12 g) are the
      ADR-0008 DESIGN ASSUMPTIONs the E5-05c/E7 campaign carries.
  - >-
      DC7 stage-1 cutoff and separation (replaces the inherited DC2 burn window): MECO at
      123 s and separation at 126 s (the inherited vehicle cuts off at 135 s / 138 s).
      Reason: the E5-08 record (RECOVERY_GAP_E508.md) found the powered-entry recovery leg
      short of the graded reserve at the inherited staging point; a global search over the
      booster script (150+ evaluations per generation on two staging points) showed the
      binding limit is the propellant the booster carries into the recovery leg. An earlier
      cutoff leaves it 164 t more propellant and 202 m/s less speed at separation, and the
      graded reserve (100 t) is met at the corridor with the inherited limits unchanged.
      Cost, not hidden: the ship has to make up the speed.
  - >-
      DC7 stage-2 burn window and pitch program (replaces the inherited DC3): the ship
      burns 388.663 s (inherited 378 s) from its spare propellant, and the post-MECO
      elevation nodes (155-445 s) are re-tuned, searched with the same fixed-program
      OpenTsiolkovsky flight so that every inherited ascent limit still holds (periapsis
      >= 230 km, apoapsis inside 250 +/- 60 km, inclination 51.6 +/- 1 deg, 3.0 g, max-Q
      55 kPa). The ship keeps ~100 t for deorbit and landing instead of ~119 t: that is the
      price of the booster's reserve, reported in the comparison record, not absorbed.
  - >-
      DC4 nose geometry and aero: UNCHANGED (13.5 m tangent ogive assumption, +-30 %,
      tables regenerated from the nose by orbitopt.flightlab.nose_aero and held equal by
      test). Reason: keeping the aero identity makes the Max-Q / peak-g comparison between
      reference and derived vehicle isolate DC1; a nose change would move both and confound
      the report.
  - >-
      DC5 stage masses, engines (33 x Raptor 2 stage-1 set at the 95 % figure; 6-engine
      ship; 13-engine relight set at the 40 % floor) and launch site / epoch: UNCHANGED.
      Reason: the task inherits the E5-07 sourced constraint set; re-sizing stages or
      engines without a new public basis would break the provenance rule (every parameter
      sourced or a reasoned DESIGN ASSUMPTION).
  - >-
      Block 1 figures throughout, Raptor 2 at 2.256 MN sea-level / 327 s SL Isp / 350 s
      vacuum, ship set at the thrust-weighted 365 s effective Isp -- inherited one for one
      from starship_class_public_estimate.yaml, with the same source caveats (public
      disagreement on the vacuum Isp figure; the nose length is an assumption with no
      public value).
  - >-
      The booster section models its relightable engines as one set; the real vehicle shuts
      down toward 3 engines for the last seconds of the landing burn, which one engine set
      cannot express (inherited limitation; the E8-05 landing comparison declares its
      3-engine landing configuration).
  - >-
      DC8-1/DC8-2 staging DESIGN ASSUMPTIONs (E10-02): the 5 %/s throttle-slew
      limit and the 4 % mated plume-axial loss are assumptions with no public
      figure (public sources give the Raptor 40-100 % throttle range and the
      behaviour of a gradual, engine-by-engine MECO, but neither a slew rate nor
      a mated-stage interference coefficient); the staging timeline itself is
      declared in the 'staging:' block and validated by
      orbitopt.flightlab.hot_staging. The single-body models (OT, twin) fly the
      composite stack thrust and lose only the booster's 0.5-s post-separation
      floor burn (2.6 t, ~1 m/s, booster-only -- declared, never absorbed).
staging:
  schema: hot-staging-v1
  throttle_down_start_s: 100.0
  ship_ignition_s: 124.0
  separation_s: 125.0
  booster_meco_s: 125.5
  plume_axial_loss_fraction: 0.04
  throttle_slew_max_fraction_per_s: 0.05
  thrust_step_max_fraction: 0.175
  throttle_floor_fraction: 0.40
simulation:
  end_time_s: 700.0
  output_step_s: 2.0
  integrator: {method: rk45}
attitude_program:
  # inherited from the reference (DC2/DC4): constant 36 deg azimuth from
  # Kourou reaches 51.6 deg inclination; gentle early pitch-over keeps max-q
  # at 37.5 kPa; lofted MECO (el 44). E10-02: every node after the booster
  # phase rides the SHIP clock, which hot staging starts 2 s earlier than
  # DC7's (ignition at 124 s against separation + cold gap at 126 s), so the
  # post-staging nodes are shifted -2.0 s in absolute time, and the tail node
  # is held at el -1.5 deg by 508 s (against DC7's +2.7 deg at 516 s) so the
  # flight-path angle is near zero at cutoff and the orbit closes the band
  - {t_s: 0.0, azimuth_deg: 36.0, elevation_deg: 90.0}
  - {t_s: 15.0, azimuth_deg: 36.0, elevation_deg: 90.0}
  - {t_s: 35.0, azimuth_deg: 36.0, elevation_deg: 78.0}
  - {t_s: 60.0, azimuth_deg: 36.0, elevation_deg: 64.0}
  - {t_s: 85.0, azimuth_deg: 36.0, elevation_deg: 56.0}
  - {t_s: 110.0, azimuth_deg: 36.0, elevation_deg: 44.0}
  - {t_s: 133.0, azimuth_deg: 36.0, elevation_deg: 44.0}
  - {t_s: 139.0, azimuth_deg: 36.0, elevation_deg: 44.0}
  - {t_s: 153.0, azimuth_deg: 36.0, elevation_deg: 31.645}
  - {t_s: 198.0, azimuth_deg: 36.0, elevation_deg: 21.573}
  - {t_s: 258.0, azimuth_deg: 36.0, elevation_deg: 12.077}
  - {t_s: 318.0, azimuth_deg: 36.0, elevation_deg: 8.408}
  - {t_s: 378.0, azimuth_deg: 36.0, elevation_deg: 8.319}
  - {t_s: 428.0, azimuth_deg: 36.0, elevation_deg: 6.349}
  - {t_s: 443.0, azimuth_deg: 36.0, elevation_deg: 4.146}
  - {t_s: 508.0, azimuth_deg: 36.0, elevation_deg: -1.5}
stages:
  - mass_initial_kg: 3525000.0
    mass_dry_kg: 275000.0
    engine:
      thrust_vac_n: [[0.0, 74926500.0], [100.0, 74926500.0], [105.0, 62000000.0], [116.0, 62000000.0], [125.5, 29970600.0]]
      isp_vac_s: 350.0
