      ca_power_off: [[0, 0.2156], [0.5, 0.2459], [0.8, 0.2935], [1, 0.3873], [1.2, 0.5613], [1.5, 0.6213], [2, 0.5413], [3, 0.4422], [4, 0.3944], [6, 0.347], [8, 0.324], [12, 0.302]]
