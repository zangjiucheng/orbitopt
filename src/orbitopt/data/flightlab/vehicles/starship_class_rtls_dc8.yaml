    engine:
      thrust_vac_n: [[0.0, 14760000.0], [185.0, 14760000.0], [185.0, 5904000.0], [378.0, 5904000.0], [383.0, 5904000.0], [383.001, 4428000.0], [388.663, 4428000.0]]
      isp_vac_s: 365
      burn_start_s: 0.0
      burn_end_s: 388.663
      nozzle_exit_area_m2: 16.44
    aero:
      diameter_m: 9.0
      ca: [[0, 0.0378], [0.5, 0.0369], [0.8, 0.0357], [1, 0.0843], [1.2, 0.3018], [1.5, 0.4065], [2, 0.3732], [3, 0.3251], [4, 0.3053], [6, 0.2877], [8, 0.28], [12, 0.2734]]
      ca_power_off: [[0, 0.1578], [0.5, 0.1894], [0.8, 0.2389], [1, 0.3343], [1.2, 0.5101], [1.5, 0.5731], [2, 0.4982], [3, 0.4085], [4, 0.3678], [6, 0.3293], [8, 0.3112], [12, 0.2942]]
      cn_alpha_per_rad: 2
      ballistic_coefficient_kg_m2: 1600
    free_flight: attitude_program
booster:
  provenance: public_estimate
  dry_mass_kg:
    value: 275000.0
    provenance: public_estimate
    source: Wikipedia, SpaceX Super Heavy (empty mass 275 t); older revisions list 200 t, so the spread across sources is large
    as_of: "2026-11"
    uncertainty_pct: 10.0
  landing_propellant_reserve_kg:
    value: 150000.0
    provenance: illustrative
    source: planning margin for boostback, entry burn and landing carried by the booster model (about half the dry mass); the graded reserve belongs to the flight target
    as_of: "2026-11"
  reference_area_m2:
    value: 63.617
    provenance: public_estimate
    source: pi/4 * 9^2 with the published 9 m body diameter
    as_of: "2026-11"
    uncertainty_pct: 2.0
  cd_mach:
    value: [[0.0, 0.8], [0.8, 0.9], [1.1, 1.3], [2.0, 1.25], [4.0, 1.2], [8.0, 1.15]]
    provenance: illustrative
    source: blunt-cylinder-class table for the booster falling engines-first with grid fins stowed; not derived from the declared nose, which the booster does not carry
    as_of: "2026-11"
    accuracy: "+/-30% (generic aero, attitude-dependent)"
    uncertainty_pct: 30.0
  engines:
    count: 13
    usable_for: [boostback, entry, landing]
    thrust_vacuum_n: 2390000.0
    isp_sea_level_s: 327.0
    isp_vacuum_s: 350.0
    nozzle_exit_area_m2: 1.33
    throttle_min: 0.4
    throttle_max: 1.0
    restarts_max: 3
  assumptions:
    - Three ignitions after separation, one per phase (boostback, entry burn,
      landing) -- design change DC1; the entry is a powered phase for this
      vehicle, unlike the E5-07 reference it is derived from.
geometry:
  stages:
    - {length_m: 71.0}
    - {length_m: 50.3}
  nose: {shape: tangent_ogive, length_m: 13.5}
data_provenance:
  simulation:
    provenance: illustrative
    source: inherited from starship_class_public_estimate.yaml (scenario choice)
    as_of: "2026-11"
  attitude_program:
    provenance: illustrative
    source: inherited from starship_class_public_estimate.yaml up to MECO (authored gravity-turn-style program for this scenario, not a flown profile); the post-MECO elevation nodes (155-445 s) are re-tuned by DC7 so the earlier cutoff still reaches the same insertion band; E10-02 shifts every post-staging node -2.0 s so the program rides the ship clock from hot ignition (124.0 s) instead of DC7's separation-plus-gap (126.0 s)
    as_of: "2026-11"
  stages[0]:
    provenance: illustrative
    source: "ballistic coefficient inherited unchanged from starship_class_public_estimate.yaml; burn window and separation timing are DC8 (throttle-down from 100 s, ship ignition 124.0 s, separation 125.0 s, booster MECO 125.5 s)"
    as_of: "2026-11"
  stages[0].mass_initial_kg:
    provenance: public_estimate
    source: Wikipedia, SpaceX Super Heavy -- Block 1 empty mass 275 t plus 3,250 t propellant (inherited)
    as_of: "2026-11"
    uncertainty_pct: 5.0
  stages[0].mass_dry_kg:
    provenance: public_estimate
    source: Wikipedia, SpaceX Super Heavy -- empty mass 275 t (older revisions 200 t) (inherited)
    as_of: "2026-11"
    uncertainty_pct: 10.0
  stages[0].engine.thrust_vac_n:
    provenance: illustrative
    source: inherited from starship_class_public_estimate.yaml, re-timed by DC8-1 (continuous throttle-down 100-105 s and 116-125.5 s to the 40 % floor, shutoff AT the floor at 125.5 s; all levels inside the published 40-100 % Raptor throttle band; 74.93 MN = 33 Raptor 2 at 95 %; max slew 4.5 %/s of peak, inside the declared 5 %/s assumption)
    as_of: "2026-11"
    uncertainty_pct: 5.0
  stages[0].engine.isp_vac_s:
