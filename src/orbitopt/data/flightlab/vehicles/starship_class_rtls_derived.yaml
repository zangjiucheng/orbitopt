    as_of: "2026-11"
    uncertainty_pct: 5.0
  stages[0].engine.isp_vac_s:
    provenance: public_estimate
    source: Wikipedia, SpaceX Raptor -- Raptor 2 vacuum Isp quoted 350 s / 363 s depending on source (inherited)
    as_of: "2026-11"
