# Flight Lab vehicle: E5-08 NEW VEHICLE DESIGN derived from
# starship_class_public_estimate.yaml (the E5-07 physics-qualification
# reference). Same public-estimate stack and the same sourced ascent
# parameters; the design changes below are the E5-08 design work, each tagged
# in 'data_provenance:' and reasoned in 'assumptions:'. (flight-vehicle-1.0,
# orbitopt.flightlab.vehicle_catalog)
#
# Design changes vs the E5-07 reference (the E5-07 RECOVERY_GAP.md is the
# starting point: the reference's restart-2 aerodynamic-entry RTLS profile has
# no representation in the FL-302 planner, which accepts 1 + entry_burns
# ignitions, entry_burns in {1, 2}):
#  * DC1 (recovery scheme): the booster returns on a POWERED entry --
#    boostback, ONE throttled entry burn, landing burn: three ignitions,
#    restarts_max 3, relight set usable_for [boostback, entry, landing].
#    This is the F9-heritage architecture (boostback + landing burn) extended
#    by the powered entry deceleration SpaceX has flown on Starship flight
#    tests; it is the profile the shipped E3 chain can plan and fly, so the
#    recovery leg CLOSES instead of being reported as a gap.
#  * DC2..DC5 (ascent, stage masses, engines, nose): UNCHANGED from the
#    reference, deliberately -- see assumptions. Max-Q and peak-g comparisons
#    therefore isolate the recovery change from ascent drift, and the +-30 %
#    generated-aero sensitivity band of the reference carries over verbatim.
schema_version: flight-vehicle-1.0
name: starship-class-rtls-derived-v1
provenance: public_estimate
as_of: "2026-11"
disclaimer: >
  Derived DESIGN on the public-estimate Starship-class stack of
  starship_class_public_estimate.yaml: inherited figures keep that file's
  public-estimate tags; every design change is tagged illustrative with its
  reason. Not official SpaceX performance data and never to be presented as
  such.
assumptions:
  - >-
      DC1 recovery scheme (DESIGN CHANGE): three relightable ignitions after separation
      (boostback, one throttled powered entry burn, landing burn) with the 13-engine
      relight set usable for all three phases. Reason: the E5-07 RECOVERY_GAP.md -- the
      reference's boostback + aerodynamic entry + landing needs 2 ignitions with an
      UNPOWERED entry the FL-302 planner cannot represent, so the reference mission
      declares no recovery stage; a powered entry (entry_burns = 1) is the closest profile
      the shipped chain plans, flies and grades, and powered entry deceleration is public
      behaviour of the class (the flip-and-burn deceleration of the Starship flight tests,
      the landing burn of Falcon 9). Entry-phase planning limits (250 kPa / 12 g) are the
      ADR-0008 DESIGN ASSUMPTIONs the E5-05c/E7 campaign carries.
  - >-
      DC2 stage-1 burn window and throttle schedule: UNCHANGED (cutoff 135 s). Reason: the
      E5-07 record shows 466 t unburned at MECO against a 100 t graded reserve -- the
      reserve was never the reference's gap (the gap was architectural), so no earlier
      cutoff is designed in; cutting earlier would trade stage-2 propellant (and so
      delivered payload) for reserve that is already sufficient. Re-verified against the
      flown recovery budget in the E5-08 comparison record.
  - >-
      DC3 stage-2 burn window: UNCHANGED (cutoff 378 s after ignition, ~1,081 t burned,
      ~119 t kept). Reason: same delivered insertion orbit as the reference (232.5 x 292.1
      km at 51.98 deg) with no constraint relaxation; payload capability is then identical
      by construction and the comparison report attributes every REAL difference to DC1 and
      model uncertainty.
  - >-
      DC4 nose geometry and aero: UNCHANGED (13.5 m tangent ogive assumption, +-30 %,
      tables regenerated from the nose by orbitopt.flightlab.nose_aero and held equal by
      test). Reason: keeping the aero identity makes the Max-Q / peak-g comparison between
      reference and derived vehicle isolate DC1; a nose change would move both and confound
      the report.
  - >-
      DC5 stage masses, engines (33 x Raptor 2 stage-1 set at the 95 % figure; 6-engine
      ship; 13-engine relight set at the 40 % floor) and launch site / epoch: UNCHANGED.
      Reason: the task inherits the E5-07 sourced constraint set; re-sizing stages or
      engines without a new public basis would break the provenance rule (every parameter
      sourced or a reasoned DESIGN ASSUMPTION).
  - >-
      Block 1 figures throughout, Raptor 2 at 2.256 MN sea-level / 327 s SL Isp / 350 s
      vacuum, ship set at the thrust-weighted 365 s effective Isp -- inherited one for one
      from starship_class_public_estimate.yaml, with the same source caveats (public
      disagreement on the vacuum Isp figure; the nose length is an assumption with no
      public value).
  - >-
      The booster section models its relightable engines as one set; the real vehicle shuts
      down toward 3 engines for the last seconds of the landing burn, which one engine set
      cannot express (inherited limitation; the E8-05 landing comparison declares its
      3-engine landing configuration).
simulation:
  end_time_s: 700.0
  output_step_s: 2.0
  integrator: {method: rk45}
attitude_program:
  # inherited byte-for-byte from the reference (DC2/DC4): constant 36 deg
  # azimuth from Kourou reaches 51.6 deg inclination; gentle early pitch-over
  # keeps max-q at 37.5 kPa; lofted MECO (el 44); ship tail held at el +2.7
  # deg so the flight-path angle is near zero at cutoff
  - {t_s: 0.0, azimuth_deg: 36.0, elevation_deg: 90.0}
  - {t_s: 15.0, azimuth_deg: 36.0, elevation_deg: 90.0}
  - {t_s: 35.0, azimuth_deg: 36.0, elevation_deg: 78.0}
  - {t_s: 60.0, azimuth_deg: 36.0, elevation_deg: 64.0}
  - {t_s: 85.0, azimuth_deg: 36.0, elevation_deg: 56.0}
  - {t_s: 110.0, azimuth_deg: 36.0, elevation_deg: 44.0}
  - {t_s: 135.0, azimuth_deg: 36.0, elevation_deg: 44.0}
  - {t_s: 141.0, azimuth_deg: 36.0, elevation_deg: 44.0}
  - {t_s: 155.0, azimuth_deg: 36.0, elevation_deg: 30.0}
  - {t_s: 200.0, azimuth_deg: 36.0, elevation_deg: 18.0}
  - {t_s: 260.0, azimuth_deg: 36.0, elevation_deg: 12.0}
  - {t_s: 320.0, azimuth_deg: 36.0, elevation_deg: 8.0}
  - {t_s: 380.0, azimuth_deg: 36.0, elevation_deg: 4.0}
  - {t_s: 430.0, azimuth_deg: 36.0, elevation_deg: 3.2}
  - {t_s: 445.0, azimuth_deg: 36.0, elevation_deg: 2.7}
  - {t_s: 518.0, azimuth_deg: 36.0, elevation_deg: 2.7}
stages:
  - mass_initial_kg: 3525000.0
    mass_dry_kg: 275000.0
    engine:
      thrust_vac_n: [[0.0, 74926500.0], [100.0, 74926500.0], [101.0, 62000000.0], [135.0, 55300000.0]]
      isp_vac_s: 350.0
      burn_start_s: 0.0
      burn_end_s: 135
      nozzle_exit_area_m2: 43.89
    aero:
      diameter_m: 9.0
      ca: [[0, 0.0956], [0.5, 0.0934], [0.8, 0.0903], [1, 0.1373], [1.2, 0.353], [1.5, 0.4546], [2, 0.4163], [3, 0.3588], [4, 0.3319], [6, 0.3054], [8, 0.2927], [12, 0.2812]]
      ca_power_off: [[0, 0.2156], [0.5, 0.2459], [0.8, 0.2935], [1, 0.3873], [1.2, 0.5613], [1.5, 0.6213], [2, 0.5413], [3, 0.4422], [4, 0.3944], [6, 0.347], [8, 0.324], [12, 0.302]]
      cn_alpha_per_rad: 2
      ballistic_coefficient_kg_m2: 3600
    free_flight: attitude_program
    separation_time_s: 138.0
  - mass_initial_kg: 1300000.0
    mass_dry_kg: 100000.0
    engine:
      thrust_vac_n: [[0.0, 14760000.0], [185.0, 14760000.0], [185.0, 5904000.0], [380.0, 5904000.0]]
      isp_vac_s: 365
      burn_start_s: 0.0
      burn_end_s: 378.0
      nozzle_exit_area_m2: 16.44
    aero:
      diameter_m: 9.0
      ca: [[0, 0.0378], [0.5, 0.0369], [0.8, 0.0357], [1, 0.0843], [1.2, 0.3018], [1.5, 0.4065], [2, 0.3732], [3, 0.3251], [4, 0.3053], [6, 0.2877], [8, 0.28], [12, 0.2734]]
      ca_power_off: [[0, 0.1578], [0.5, 0.1894], [0.8, 0.2389], [1, 0.3343], [1.2, 0.5101], [1.5, 0.5731], [2, 0.4982], [3, 0.4085], [4, 0.3678], [6, 0.3293], [8, 0.3112], [12, 0.2942]]
      cn_alpha_per_rad: 2
      ballistic_coefficient_kg_m2: 1600
    free_flight: attitude_program
booster:
  provenance: public_estimate
  dry_mass_kg:
    value: 275000.0
    provenance: public_estimate
    source: Wikipedia, SpaceX Super Heavy (empty mass 275 t); older revisions list 200 t, so the spread across sources is large
    as_of: "2026-11"
    uncertainty_pct: 10.0
  landing_propellant_reserve_kg:
    value: 150000.0
    provenance: illustrative
    source: planning margin for boostback, entry burn and landing carried by the booster model (about half the dry mass); the graded reserve belongs to the flight target
    as_of: "2026-11"
  reference_area_m2:
    value: 63.617
    provenance: public_estimate
    source: pi/4 * 9^2 with the published 9 m body diameter
    as_of: "2026-11"
    uncertainty_pct: 2.0
  cd_mach:
    value: [[0.0, 0.8], [0.8, 0.9], [1.1, 1.3], [2.0, 1.25], [4.0, 1.2], [8.0, 1.15]]
    provenance: illustrative
    source: blunt-cylinder-class table for the booster falling engines-first with grid fins stowed; not derived from the declared nose, which the booster does not carry
    as_of: "2026-11"
    accuracy: "+/-30% (generic aero, attitude-dependent)"
    uncertainty_pct: 30.0
  engines:
    count: 13
    usable_for: [boostback, entry, landing]
    thrust_vacuum_n: 2390000.0
    isp_sea_level_s: 327.0
    isp_vacuum_s: 350.0
    nozzle_exit_area_m2: 1.33
    throttle_min: 0.4
    throttle_max: 1.0
    restarts_max: 3
  assumptions:
    - Three ignitions after separation, one per phase (boostback, entry burn,
      landing) -- design change DC1; the entry is a powered phase for this
      vehicle, unlike the E5-07 reference it is derived from.
geometry:
  stages:
    - {length_m: 71.0}
    - {length_m: 50.3}
  nose: {shape: tangent_ogive, length_m: 13.5}
data_provenance:
  simulation:
    provenance: illustrative
    source: inherited from starship_class_public_estimate.yaml (scenario choice)
    as_of: "2026-11"
  attitude_program:
    provenance: illustrative
    source: inherited byte-for-byte from starship_class_public_estimate.yaml (authored gravity-turn-style program for this scenario, not a flown profile); DC2 keeps the ascent identical so the comparison report isolates DC1
    as_of: "2026-11"
  stages[0]:
    provenance: illustrative
    source: "burn window, throttle, separation timing and ballistic coefficient inherited unchanged from starship_class_public_estimate.yaml (DC2: unchanged)"
    as_of: "2026-11"
  stages[0].mass_initial_kg:
    provenance: public_estimate
