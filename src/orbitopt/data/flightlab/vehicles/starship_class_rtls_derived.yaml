    as_of: "2026-11"
  stages[1].mass_initial_kg:
    provenance: public_estimate
    source: Wikipedia, SpaceX Starship -- Block 1 empty mass about 100 t plus about 1,200 t propellant (inherited)
    as_of: "2026-11"
    uncertainty_pct: 5.0
  stages[1].mass_dry_kg:
    provenance: public_estimate
    source: Wikipedia, SpaceX Starship -- Block 1 empty mass about 100 t (Block 2 listed 85 t) (inherited)
    as_of: "2026-11"
    uncertainty_pct: 10.0
  stages[1].engine.thrust_vac_n:
