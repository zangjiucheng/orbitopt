# orbitopt launch-site database (schema: orbitopt/schemas/launch-sites-1.0.json)
#
# One entry per launch site. Every entry carries a `sources` list; each field
# group (location, altitude, azimuth_corridors, rotation_speed_gain) names the
# source(s) it was taken from via `sources[*].covers` -- the loader rejects a
# site with an uncovered field group. Each source records
#   ref         (required) the document / page / method
#   provenance  (required) official        -- launch provider / agency document
#                          public_estimate -- secondary reference, public
#                                             compilation or reconstruction;
#                                             approximate, NOT an official value
#                          derived         -- computed from other fields
#   accuracy    (optional) stated or estimated accuracy
#   as_of       (optional) "YYYY[-MM[-DD]]": publication or access date
# Limitations are documented in docs/launch-data-sources.md.
#
# Conventions
#   latitude_deg / longitude_deg : geodetic (WGS-84), degrees; east-positive.
#   altitude_m                   : height of the reference pad above sea level
#                                  (approximate, a few-metre accuracy is
#                                  irrelevant for the rotation gain).
#   rotation_speed_gain_m_s      : eastward inertial velocity of the pad due
#                                  to Earth rotation, omega_E * (N(phi)+h) *
#                                  cos(phi) with WGS-84 N(phi). The loader
#                                  re-computes this and rejects entries that
#                                  disagree by more than 1 m/s.
#   azimuth_corridors_deg        : allowed launch azimuths (range safety),
#                                  degrees clockwise from true north. Each
#                                  corridor is [start, end] swept clockwise;
#                                  a corridor may wrap through north (e.g.
#                                  [349.5, 93.5]).
#
# Reachable inclinations are *derived* from latitude + corridors
# (cos i = cos(phi) sin(Az)) for a direct ascent without dog-leg manoeuvres;
# they are not stored here. Corridors marked `confidence: approximate` were
# reconstructed from the envelope of historically flown inclinations rather
# than taken from a published range-safety document -- treat them as a
# planning-level constraint, not an authoritative range limit.
schemaVersion: "1.0"
sites:
  - id: cape-canaveral
    name: Cape Canaveral / Kennedy Space Center
    aliases: [KSC, CCSFS, CCAFS, Cape Canaveral, Kennedy, LC-39A, SLC-40, Eastern Range]
    country: USA
    reference_pad: KSC LC-39A
    latitude_deg: 28.6082
    longitude_deg: -80.6041
    altitude_m: 15
    rotation_speed_gain_m_s: 408.6
    azimuth_corridors_deg:
      - [35.0, 120.0]
    confidence: published
    sources:
      - covers: [rotation_speed_gain]
        ref: "Derived: omega_E * (N(phi) + h) * cos(phi), omega_E = 7.2921150e-5 rad/s (IERS Conventions 2010), WGS-84 ellipsoid (NGA TR8350.2)"
        provenance: derived
        accuracy: "<1 m/s (loader recomputes and rejects >1 m/s disagreement)"
        as_of: "2026"
      - covers: [location, altitude]
        ref: "NASA KSC, Launch Complex 39A fact sheet; coordinates as listed on Wikipedia 'Kennedy Space Center Launch Complex 39A' (accessed 2026)"
        provenance: public_estimate
        accuracy: "~100 m horizontal (pad centre); altitude +/-10 m"
        as_of: "2026"
      - covers: [azimuth_corridors]
        ref: "Isakowitz, Hopkins & Hopkins, International Reference Guide to Space Launch Systems, 4th ed., AIAA 2004 -- Eastern Range launch azimuths 35-120 deg"
        provenance: public_estimate
        accuracy: "+/-1 deg; Eastern Range limits as reproduced in a secondary reference, actual per-mission limits set by the range"
        as_of: "2004"

