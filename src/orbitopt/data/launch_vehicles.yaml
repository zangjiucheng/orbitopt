# orbitopt launch-vehicle performance database (schema: launch-vehicles-1.0).
#
# Every number carries a `provenance` tag:
#   official         -- published by the launch provider / agency (user guide,
#                       press kit, provider website)
#   public_estimate  -- derived from public sources (e.g. digitized NASA Launch
#                       Services Program performance curves, mission history,
#                       third-party analyses). Treat as approximate.
#
# Units: payload in kg, C3 in km^2/s^2, coast duration in seconds.
# `c3_curve.points` are [C3, max payload] pairs: C3 strictly increasing,
# payload strictly decreasing. Queries outside the tabulated C3 / payload
# range raise or are flagged -- the model never extrapolates.
#
# `upper_stage.max_restarts` counts re-ignitions after the first upper-stage
# burn (so total burns = max_restarts + 1). `max_coast_s` is the longest
# single coast between burns the stage is qualified/advertised for.
#
# To use your own data, copy this file and pass its path to
# orbitopt.launch_vehicles.load_launch_vehicles(path).
schema_version: "1.0"
vehicles:
  falcon-9:
    name: Falcon 9 Block 5 (expendable)
    provider: SpaceX
    family: Falcon
    orbit_capability:
      LEO: {payload_kg: 22800, provenance: official, source: "SpaceX website (expendable)"}
      GTO: {payload_kg: 8300, provenance: official, source: "SpaceX website (expendable)"}
      TLI: {payload_kg: 4400, provenance: public_estimate, source: "Estimated from C3 curve at C3 ~ -2"}
    c3_curve:
      provenance: public_estimate
      source: "Approximate digitization of NASA LSP performance curve"
      points:
        - [-2.0, 5200]
        - [0.0, 4900]
        - [10.0, 3900]
        - [20.0, 3000]
        - [30.0, 2200]
        - [40.0, 1500]
        - [50.0, 950]
        - [60.0, 500]
    upper_stage:
      name: Falcon 9 second stage (Merlin 1D Vacuum)
      max_restarts: 2
      max_coast_s: 21600
      provenance: public_estimate
      notes: "Long coasts (several hours) require the extended-mission kit."

